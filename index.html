function tableRelev(){
  const el = $('#rel-table'); if(!el) return;
  const fl = FL, cads = cadrans(fl), dec = FLUIDES[fl].dec;
  const R = relevesDe(fl);
  const anos = anomaliesDe(S.releves, fl);
  const audit = $('#rel-audit');
  if(audit) audit.innerHTML = anos.map(a=>
    `<div class="msg ${a.t==='err'?'err':'warn'}" style="margin-top:10px">${a.m}</div>`).join('');
  if(!R.length){ el.innerHTML = `<tr><td class="vide">—</td></tr>`; return; }
  const cpts = compteursDe(fl);
  const touche = id => anos.filter(a=>a.rels.includes(id));
  const per = periodesMesurees(fl);
  const finissantEn = id => per.find(p=> p.B.id === id);
  /* Les compteurs d'un même logement se partagent ses colonnes : leurs index se
     superposent dans la cellule au lieu d'ajouter deux colonnes. L'ordre de
     grandeur suffit à reconnaître celui du chauffage. */
  const groupes = [];
  const gen = cpts.filter(c=> !c.logement);
  if(gen.length) groupes.push({nom:gen[0].nom, cpts:gen});
  for(const l of logementsDe()){
    const g = cpts.filter(c=> c.logement === l.id);
    if(g.length) groupes.push({nom:l.nom, cpts:g});
  }
  const colonnes = [];
  groupes.forEach(g=> cads.forEach(cad=> colonnes.push({g, cad})));

  el.innerHTML = `<thead><tr><th>${t('date')}</th>
      ${colonnes.map(x=>`<th>${esc(x.g.nom)}${cads.length>1
        ?'<br><span style="font-weight:400">'+nomCadranCourt(x.cad)+'</span>':''}</th>`).join('')}
      <th>${t('consoDepuis')}</th><th>${t('parAn')}</th><th>${t('ecart')}</th></tr></thead><tbody>`
    + [...R].reverse().map(r=>{
      const a = touche(r.id), pire = a.some(x=>x.t==='err') ? 'err' : (a.length ? 'warn' : '');
      return `<tr class="cliquable" data-ligne="${r.id}" title="${t('clicModifier')}">
        <td>${pire?`<span title="${esc(a.map(x=>x.m.replace(/<[^>]+>/g,'')).join(' · '))}"
          style="color:var(--${pire==='err'?'err':'warn'})">⚠</span> `:''}${dateFr(r.date)}</td>`
      + colonnes.map(x=>`<td class="num">${x.g.cpts.map(c=>{
            const v = idx(r, c.id, x.cad);
            return v==null ? '—' : nf(v,dec);
          }).join('<br>')}</td>`).join('')
      + (()=>{ const p = finissantEn(r.id);
          if(!p) return `<td class="num">—</td><td class="num">—</td><td class="num">—</td>`;
          if(!p.valide) return `<td colspan="3" style="color:var(--ink-3); font-style:italic">${t('periodeInvalide')}</td>`;
          return `<td class="num"><b>${qte(p.general, fl)}</b><br>
            <span style="color:var(--ink-3); font-size:12px">${p.d} ${t('jours')}</span></td>
            <td class="num">${p.d >= MINJ ? qte(p.general*365/p.d, fl) : '—'}</td>
            <td class="num">${p.hasGen ? signe(p.ecart, fl) + `<br>
              <span style="color:var(--ink-3); font-size:12px">${nf(p.somme?Math.abs(p.ecart/p.somme*100):0,1)} %</span>` : '—'}</td>`;
        })()
      + `</tr>`;}).join('') + `</tbody>`;
  el.querySelectorAll('[data-ligne]').forEach(tr=> tr.onclick = ()=>{
    relEdit = tr.dataset.ligne; ouvrir('rel');
  });
}

function tableFac(){
  const el = $('#fac-table'); if(!el) return;
  const fl = FL, cads = cadrans(fl), dp = FLUIDES[fl].decPrix;
  const F = facturesDe(fl);
  if(!F.length){ el.innerHTML = `<tr><td class="vide">—</td></tr>`; return; }
  const mt = mention(fl);
  el.innerHTML = `<thead><tr><th>${t('facture')}</th><th>${t('periode')}</th>
      ${cads.map(c=>`<th>${cads.length>1?nomCadran(c)+' '+mt
        :t(fl==='eau'?'prixUnitEau':'prixUnitElec')}</th>`).join('')}
      <th>${t('evolution')}</th><th>${t('abonnement')} ${mt}</th></tr></thead><tbody>`
    + F.map((f,i)=>({f,i})).reverse().map(({f,i})=>{
        const ref = cads[cads.length-1];
        const p = prixDe(f,ref), pp = i>0 ? prixDe(F[i-1],ref) : null;
        const ev = (pp && pp>0) ? (p/pp-1)*100 : null;
        return `<tr class="cliquable" data-voir="${f.id}" title="${t('clicVoir')}">
        <td>${esc(f.libelle)}</td>
        <td class="num">${f.debut&&f.fin?dateFr(f.debut)+' → '+dateFr(f.fin):dateFr(f.date)}</td>
        ${cads.map(c=>`<td class="num"><b>${nf(prixAff(f,c),dp)} €</b></td>`).join('')}
        <td class="num" style="color:${ev==null?'var(--ink-3)':(ev>0?'var(--c3)':'var(--c1)')}">${
          ev==null?'—':(ev>0?'+ ':'− ')+nf(Math.abs(ev),2)+' %'}</td>
        <td class="num">${fixeAff(f)?eur(fixeAff(f)):'—'}</td>
        </tr>`;}).join('') + `</tbody>`;
  el.querySelectorAll('[data-voir]').forEach(tr=> tr.onclick = ()=> voirFac(tr.dataset.voir));
}

function formRelev(){
  const fl = FL, cads = cadrans(fl), cpts = compteursDe(fl), dec = FLUIDES[fl].dec;
  const pas = dec ? '0.'+'0'.repeat(dec-1)+'1' : '1';
  const champ = (c, cad) => `<div><label>${esc(c.nom)}${cads.length>1?' · '+nomCadranCourt(cad):''}</label>
    <input type="number" step="${pas}" min="0" class="num" id="ri-${c.id.replace(/[:]/g,'_')}-${cad}"></div>`;
  const gen = cpts.filter(c=>!c.logement), sous = cpts.filter(c=>c.logement);
  return `<div id="rel-form">
    <div class="grid g2">
      <div><label>${t('dateReleve')}</label><input type="date" id="rel-date"></div>
    </div>
    ${gen.length ? `<h4>${fl==='elec'?t('compteurGenFac'):t('compteurGen')}</h4>
      <div class="grid g5">${gen.map(c=> cads.map(cad=> champ(c,cad)).join('')).join('')}</div>` : ''}
    <h4>${t('indexRel')}</h4>
    <div class="grid g5">${sous.map(c=> cads.map(cad=> champ(c,cad)).join('')).join('')}</div>
  </div>`;
}
const champId = (cid, cad) => '#ri-' + cid.replace(/[:]/g,'_') + '-' + cad;

function chargerRelev(r){
  relEdit = r ? r.id : null;
  $('#rel-date').value = r ? r.date : new Date().toISOString().slice(0,10);
  for(const c of compteursDe(FL)) for(const cad of cadrans(FL)){
    const e = $(champId(c.id, cad));
    if(e) e.value = r ? (idx(r, c.id, cad) != null ? idx(r, c.id, cad) : '') : '';
  }
  msg($('#rel-msg'),'');
}

function brancherRelev(){
  $('#rel-save').onclick = ()=>{
    const fl = FL, date = $('#rel-date').value;
    if(!date) return msg($('#rel-msg'), t('errDate'));
    const index = {};
    for(const c of compteursDe(fl)){
      const o = {}; let vide = 0;
      for(const cad of cadrans(fl)){
        const v = num($(champId(c.id, cad)));
        if(v === null){ vide++; continue; }
        if(v < 0) return msg($('#rel-msg'), t('errIndexManquant',{x:esc(c.nom)}));
        o[cad] = v;
      }
      // le compteur général peut rester vide, un sous-compteur non
      if(vide && c.logement) return msg($('#rel-msg'), t('errIndexManquant',{x:esc(c.nom)}));
      if(!vide) index[c.id] = o;
    }
    if(!relEdit && relevesDe(fl).some(r=>r.date===date))
      return msg($('#rel-msg'), t('errDoublon',{x:dateFr(date)}));

    const cid = relEdit || '__neuf';
    const cand = S.releves.filter(r=>r.id!==relEdit).concat([{id:cid, fluide:fl, date, index}]);
    const bloquants = anomaliesDe(cand, fl).filter(a=> a.rels.includes(cid) && a.t==='err');
    if(bloquants.length)
      return msg($('#rel-msg'), `<b>${t('ctrlBloque')}</b><br>` + bloquants.map(a=>'• '+a.m).join('<br>'));

    if(relEdit) marquer(Object.assign(S.releves.find(x=>x.id===relEdit), {date, index}));
    else S.releves.push(marquer({id:uid(), fluide:fl, date, index}));
    S.releves.sort((a,b)=> a.date<b.date?-1:1);
    sauver(); fermer(); rafraichir();
  };
  $('#rel-cancel').onclick = fermer;
  const sup = $('#rel-del');
  if(sup) sup.onclick = ()=>{
    const r = S.releves.find(x=>x.id===relEdit); if(!r) return;
    if(!confirm(t('confSuppr',{x:dateFr(r.date)}))) return;
    enterrer('releves', relEdit);
    S.releves = S.releves.filter(x=>x.id!==relEdit);
    sauver(); fermer(); rafraichir();
  };
}

function lireFac(){
  const fl = FL;
  const base = {id: facEdit || uid(), fluide: fl,
    libelle: $('#fac-lib').value.trim() || t('facture')+' '+dateFr($('#fac-date').value),
    date: $('#fac-date').value, debut: $('#fac-debut').value, fin: $('#fac-fin').value,
    pdf: pdfTampon ? pdfTampon.data : undefined, pdfNom: pdfTampon ? pdfTampon.nom : undefined,
    fixeMode: $('#fac-fixe-mode').value};
  if(fl === 'eau') return Object.assign(base, {
    litre: num($('#fac-litre')), prix: num($('#fac-prix')),
    ht: num($('#fac-ht')), tva: num($('#fac-tva')),
    montant: num($('#fac-montant')), volume: num($('#fac-volume')),
    fixe: num($('#fac-fixe')) || 0, semestres: +$('#fac-sem').value || 1});
  return Object.assign(base, {
    pu: {hc: num($('#fac-hc')) || 0, hp: num($('#fac-hp')) || 0},
    accise: num($('#fac-accise')) || 0, cta: num($('#fac-cta')) || 0,
    abo: num($('#fac-fixe')) || 0, kva: num($('#fac-kva')),
    volume: num($('#fac-volume')), montant: num($('#fac-montant')),
    tva: num($('#fac-tva')) != null ? num($('#fac-tva')) : 20});
}
function majPrix(){
  const f = lireFac(), cads = cadrans(FL), dp = FLUIDES[FL].decPrix;
  const px = cads.map(c=> prixDe(f,c)).filter(v=>v>0);
  $('#fac-prix-calc').value = px.length
    ? cads.map(c=> (cads.length>1?nomCadranCourt(c)+' ':'') + nf(prixAff(f,c),dp) + ' €').join(' · ')
      + ' ' + mention(FL) + ' · ' + sourcePrix(f)
    : '';
  const manuel = $('#fac-fixe-mode').value === 'manuel';
  $('#fac-parts').hidden = !manuel;
  if(manuel){
    let s = 0;
    document.querySelectorAll('#fac-parts [data-part]').forEach(i=>{
      const v = parseFloat(String(i.value).replace(',','.')); if(!isNaN(v)) s += v; });
    $('#fac-parts-somme').textContent = t('partsSomme',{x:nf(s,1)})
      + (Math.abs(s-100) > 0.05 ? ' · ' + t('partsPasCent') : '');
  }
}
function chargerFac(f){
  const fl = FL;
  facEdit = f ? f.id : null;
  $('#fac-lib').value   = f ? f.libelle : '';
  $('#fac-date').value  = f ? f.date : new Date().toISOString().slice(0,10);
  $('#fac-debut').value = f && f.debut ? f.debut : '';
  $('#fac-fin').value   = f && f.fin ? f.fin : '';
  if(fl === 'eau'){
    $('#fac-litre').value   = f && f.litre!=null ? f.litre : '';
    $('#fac-prix').value    = f && f.prix!=null ? f.prix : '';
    $('#fac-ht').value      = f && f.ht!=null ? f.ht : '';
    $('#fac-tva').value     = f && f.tva!=null ? f.tva : '';
    $('#fac-montant').value = f && f.montant!=null ? f.montant : '';
    $('#fac-volume').value  = f && f.volume!=null ? f.volume : '';
    $('#fac-fixe').value    = f && f.fixe!=null ? f.fixe : '';
    $('#fac-sem').value     = f && f.semestres ? f.semestres : 2;
  }else{
    $('#fac-hc').value     = f && f.pu && f.pu.hc!=null ? f.pu.hc : '';
    $('#fac-hp').value     = f && f.pu && f.pu.hp!=null ? f.pu.hp : '';
    $('#fac-accise').value = f && f.accise!=null ? f.accise : '';
    $('#fac-cta').value    = f && f.cta!=null ? f.cta : '';
    $('#fac-fixe').value   = f && f.abo!=null ? f.abo : '';
    $('#fac-tva').value    = f && f.tva!=null ? f.tva : 20;
    $('#fac-kva').value    = f && f.kva!=null ? f.kva : '';
    $('#fac-volume').value = f && f.volume!=null ? f.volume : '';
    $('#fac-montant').value = f && f.montant!=null ? f.montant : '';
  }
  $('#fac-fixe-mode').value = f ? (f.fixeMode||'egales') : (fl==='elec' ? 'manuel' : 'egales');
  majPrix(); msg($('#fac-msg'),'');
}

function brancherFac(){
  const fl = FL;
  /* seulementVide : relecture d'un PDF déjà joint, on complète sans écraser ce
     qui a été saisi ou corrigé à la main depuis. */
  const reprendre = (txt, seulementVide) => {
    const r = analyserFacture(txt, fl);
    if(!r.trouves.length) return msg($('#fac-lu'), t('importRien'), 'warn');
    const remplis = [];
    const pose = (sel, v, cle)=>{
      const e = $(sel);
      if(!e || v == null) return;
      if(seulementVide && String(e.value).trim() !== '') return;
      e.value = v; if(cle) remplis.push(t(cle));
    };
    pose('#fac-litre', r.litre, 'champLitre');
    pose('#fac-fixe', r.fixe, fl === 'eau' ? 'champAboTtc' : 'champAbo');
    pose('#fac-montant', r.montant, 'champMontant');
    pose('#fac-volume', r.volume, 'champVolume');
    pose('#fac-hc', r.hc, 'champHC');   pose('#fac-hp', r.hp, 'champHP');
    pose('#fac-accise', r.accise, 'champAccise');
    pose('#fac-cta', r.cta, 'champCta'); pose('#fac-kva', r.kva, 'champKva');
    pose('#fac-debut', r.debut, 'debutPeriode');
    pose('#fac-fin', r.fin, 'finPeriode');
    if(r.fin && !seulementVide){
      if(!$('#fac-lib').value.trim())
        $('#fac-lib').value = (fl==='eau' ? 'Facture SAUR ' : 'EDF ') + dateFr(r.fin);
      if(!$('#fac-date').value) $('#fac-date').value = r.fin;
    }
    majPrix();
    if(!seulementVide)
      msg($('#fac-lu'), t('importLu',{x:r.trouves.map(k=>t(k)).join(', ')}), 'info');
    else if(remplis.length)
      msg($('#fac-lu'), t('relireFait',{x:remplis.join(', ')}), 'info');
    else
      msg($('#fac-lu'), t('relireRien'), 'info');
  };
  // Le PDF déjà joint est relu par la page elle-même, sans redemander le fichier.
  const relire = $('#fac-relire');
  if(relire) relire.onclick = async ()=>{
    const f = S.factures.find(x=>x.id===facEdit);
    if(!f || !f.pdf) return;
    const lu = await texteDuPdf(await blobPdf(f.pdf).arrayBuffer());
    $('#fac-coller').value = lu.txt;
    if(lu.etat === 'vide')           msg($('#fac-lu'), t('importPdfMuet'), 'warn');
    else if(lu.etat === 'illisible') msg($('#fac-lu'), t('importPdfCode'), 'warn');
    else reprendre(lu.txt, true);
  };
  $('#fac-coller').oninput = e => { if(e.target.value.trim().length > 40) reprendre(e.target.value); };
  $('#fac-fichier-btn').onclick = ()=> $('#fac-fichier').click();
  $('#fac-fichier').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    if(/\.pdf$/i.test(f.name)){
      if(f.size <= 1500000){
        pdfTampon = {nom:f.name, data: await new Promise(res=>{ const fr = new FileReader();
          fr.onload = ()=> res(fr.result); fr.readAsDataURL(f); })};
      }else msg($('#fac-lu'), t('pdfTropGros'), 'warn');
      const lu = await texteDuPdf(await f.arrayBuffer());
      $('#fac-coller').value = lu.txt;              // toujours montrer ce qui a été lu
      if(lu.etat === 'vide')          msg($('#fac-lu'), t('importPdfMuet'), 'warn');
      else if(lu.etat === 'illisible') msg($('#fac-lu'), t('importPdfCode'), 'warn');
      else if(!analyserFacture(lu.txt, fl).trouves.length)
        msg($('#fac-lu'), t('importPdfInconnu',{n:lu.txt.length}), 'warn');
      else reprendre(lu.txt);
    }else{
      const txt = await f.text();
      $('#fac-coller').value = txt;
      reprendre(txt);
    }
    e.target.value = '';
  };
  ['#fac-litre','#fac-prix','#fac-ht','#fac-tva','#fac-montant','#fac-volume','#fac-fixe',
   '#fac-hc','#fac-hp','#fac-accise','#fac-cta','#fac-kva'].forEach(x=>{
     const e = $(x); if(e) e.oninput = majPrix; });
  const sem = $('#fac-sem'); if(sem) sem.onchange = majPrix;
  $('#fac-fixe-mode').onchange = majPrix;
  document.querySelectorAll('#fac-parts [data-part]').forEach(i=> i.oninput = majPrix);

  $('#fac-save').onclick = ()=>{
    const f = lireFac();
    if(!f.date) return msg($('#fac-msg'), t('errDate'));
    const px = Math.max(...cadrans(fl).map(c=> prixDe(f,c)));
    if(!(px > 0)) return msg($('#fac-msg'), t('errPrixManquant'));
    if(px > 30) return msg($('#fac-msg'), t('errPrixFou',{x:nf(px,2)}));
    if(f.fixeMode === 'manuel'){
      S.parts[fl] = S.parts[fl] || {};
      document.querySelectorAll('#fac-parts [data-part]').forEach(i=>{
        const v = parseFloat(String(i.value).replace(',','.'));
        S.parts[fl][i.dataset.part] = isNaN(v) ? 0 : v;
      });
    }
    if(facEdit) marquer(Object.assign(S.factures.find(x=>x.id===facEdit), f));
    else S.factures.push(marquer(f));
    S.factures.sort((a,b)=> (a.date||'')<(b.date||'')?-1:1);
    sauver(); fermer(); rafraichir();
  };
  $('#fac-cancel').onclick = fermer;
}

      ${fl==='eau' ? `
        ${li(t('champVolume'), f.volume ? nf(f.volume,0)+' m³' : '')}
        ${li(t('champMontant'), f.montant ? eur(f.montant) : '')}

/* Avale une sauvegarde, qu'elle vienne d'un fichier ou d'un copier-coller. */
function avaler(texte){
  try{
    let d = JSON.parse(texte);
    if(!Array.isArray(d.logements)) throw 0;
    // une sauvegarde de l'ancienne page eau se reconnaît à ses relevés sans fluide
    if(!d.compteurs) d = convertirAncienneEau(d);
    const {etat, rap} = fusionner(S, d);
    if(!confirm(t('confFusion',{a:rap.ajoutes, m:rap.majs, i:rap.ignores}))) return;
    S = etat; sauver(); rafraichir();
    msg($('#reg-msg'), t('fusionFaite',{a:rap.ajoutes, m:rap.majs}), 'info');
  }catch(err){ msg($('#reg-msg'), t('errFichier')); }
}

/* ── synchronisation avec un dépôt privé ─────────────────
   Les données vivent dans un fichier d'un dépôt GitHub privé. Chaque appareil
   en garde une copie locale, travaille dessus hors ligne, et la réconcilie
   quand il retrouve le réseau. Trois raisons d'avoir choisi ce magasin plutôt
   qu'une base de données : il n'y a aucun serveur à entretenir, chaque
   modification devient un commit daté et signé, donc on sait qui a changé
   quoi et l'on peut revenir en arrière, et l'offre gratuite ne s'endort pas
   au bout d'une semaine, ce qui compte pour un outil employé tous les deux mois.

   La réconciliation ne fait pas gagner le dernier arrivé : elle emploie la
   fusion déjà écrite pour l'import de fichiers, qui compare enregistrement par
   enregistrement et respecte les suppressions. Deux personnes qui saisissent
   en même temps ne s'effacent donc pas l'une l'autre. */

const CLE_SYNC = KEY + '-sync';
const lireSync  = () => { try{ return JSON.parse(localStorage.getItem(CLE_SYNC)) || {}; }
                          catch(e){ return {}; } };
const ecrireSync = o => localStorage.setItem(CLE_SYNC, JSON.stringify(o));
const syncPret = () => { const c = lireSync(); return !!(c.depot && c.jeton); };

/* Le jeton n'entre jamais dans l'export : c'est un identifiant d'appareil, pas
   une donnée du dossier. Il vit sous sa propre clé, à côté de l'état. */

/* base64 et UTF-8 : les noms portent des accents, un passage naïf par btoa
   les mutile. */
const enBase64 = s => {
  const o = new TextEncoder().encode(s);
  let b = ''; for(const x of o) b += String.fromCharCode(x);
  return btoa(b);
};
const deBase64 = b =>
  new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')), c=>c.charCodeAt(0)));

function urlSync(c){
  return 'https://api.github.com/repos/' + c.depot + '/contents/'
    + (c.chemin || 'gascourt.json').split('/').map(encodeURIComponent).join('/');
}
async function appelSync(c, methode, corps){
  return fetch(urlSync(c), {
    method: methode,
    headers: {
      Authorization: 'Bearer ' + c.jeton,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    },
    body: corps ? JSON.stringify(corps) : undefined
  });
}

/* Ce qu'on envoie : l'état, sans les réglages d'affichage propres à l'appareil. */
function etatAEnvoyer(){
  const {lang, ...reste} = S;
  return JSON.stringify(reste, null, 1);
}

/* Va chercher la version distante. Renvoie null si le fichier n'existe pas
   encore, ce qui est le cas normal au premier envoi. */
async function tirer(c){
  const r = await appelSync(c, 'GET');
  if(r.status === 404) return {absent:true};
  if(r.status === 401 || r.status === 403) throw new Error('jeton');
  if(!r.ok) throw new Error('http ' + r.status);
  const j = await r.json();
  return {sha: j.sha, contenu: JSON.parse(deBase64(j.content))};
}

async function pousser(c, sha, message){
  const r = await appelSync(c, 'PUT', {
    message: message || ('Gascourt · ' + new Date().toISOString().slice(0,16).replace('T',' ')),
    content: enBase64(etatAEnvoyer()),
    sha: sha || undefined
  });
  if(r.status === 409 || r.status === 422) return {conflit:true};
  if(r.status === 401 || r.status === 403) throw new Error('jeton');
  if(!r.ok) throw new Error('http ' + r.status);
  const j = await r.json();
  return {sha: j.content && j.content.sha};
}

/* Un aller-retour complet : on prend ce qui est là-bas, on le fond avec ce
   qu'on a, on renvoie le résultat. Si quelqu'un a écrit entre notre lecture et
   notre écriture, GitHub refuse ; on recommence avec la version fraîche plutôt
   que d'écraser son travail. */
let syncEnCours = false;
async function synchroniser(manuelle){
  const c = lireSync();
  if(!c.depot || !c.jeton) return {etat:'absent'};
  if(syncEnCours) return {etat:'occupe'};
  syncEnCours = true;
  try{
    let rapport = null, sha = c.sha;
    for(let essai = 0; essai < 3; essai++){
      const distant = await tirer(c);
      if(distant.absent){ sha = null; }
      else{
        sha = distant.sha;
        const {etat, rap} = fusionner(S, distant.contenu);
        S = etat; sauver(true);
        rapport = rap;
      }
      const envoi = await pousser(c, sha, manuelle ? 'Gascourt · synchronisation manuelle' : null);
      if(!envoi.conflit){
        c.sha = envoi.sha; c.dernier = new Date().toISOString();
        ecrireSync(c);
        return {etat:'ok', rap:rapport};
      }
    }
    return {etat:'conflit'};
  }catch(e){
    return {etat: e.message === 'jeton' ? 'jeton' : 'reseau', message: e.message};
  }finally{
    syncEnCours = false;
  }
}

/* On n'envoie pas à chaque frappe : les saisies vont par rafales, et chaque
   envoi est un commit. On attend que ça se calme. */
let minuterie = null;
function programmerPoussee(){
  if(!syncPret()) return;
  clearTimeout(minuterie);
  minuterie = setTimeout(async ()=>{
    const r = await synchroniser(false);
    majEtatSync(r);
  }, 4000);
}

function majEtatSync(r){
  const el = $('#sync-etat');
  if(!el) return;
  const c = lireSync();
  if(!r){
    el.textContent = syncPret()
      ? (c.dernier ? t('syncDernier',{d:new Date(c.dernier).toLocaleString(loc())}) : t('syncJamais'))
      : t('syncInactive');
    el.className = 'englobe';
    return;
  }
  const mots = {ok:'syncFaite', absent:'syncInactive', occupe:'syncEnCours',
                conflit:'syncConflit', jeton:'syncJeton', reseau:'syncReseau'};
  el.textContent = t(mots[r.etat] || 'syncReseau',
    r.rap ? {a:r.rap.ajoutes, m:r.rap.majs} : {a:0, m:0});
  el.className = 'englobe' + (r.etat === 'ok' ? '' : ' alerte');
}

/* ── reprise des montants depuis le texte d'une facture ── */
const nbFac = x => parseFloat(String(x).replace(/[\s  ]/g,'').replace(',','.'));
const MONT = '(-?\\d[\\d ]*,\\d{2})';   // deux décimales exactes : sépare « 16,7117,63 »
function analyserFacture(txt, fl){
  const T2 = String(txt).replace(/[  ]/g,' ');
  const out = {trouves:[]}; let m;

  // dates : les deux plus récentes bornent la période facturée
  const iso = [];
  (T2.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/g) || []).forEach(d=>{
    const [j,mo,a] = d.split('/'); iso.push(a+'-'+mo+'-'+j);
  });
  if(iso.length >= 2){ iso.sort(); out.debut = iso[iso.length-2]; out.fin = iso[iso.length-1];
    out.trouves.push('luPeriode'); }

  if(fl === 'eau'){
    if((m = T2.match(/prix\s*au\s*litre[^\d]{0,60}(\d[.,]\d{3,6})/i)))
      { out.litre = nbFac(m[1]); out.trouves.push('luLitre'); }
    if((m = T2.match(new RegExp('abonnement[^\\d-]{0,30}'+MONT+'[^\\d-]{0,30}'+MONT,'i'))))
      { out.fixe = nbFac(m[2]); out.trouves.push('luFixe'); }
    if((m = T2.match(new RegExp('montant\\s*factur[ée][^\\d-]{0,30}'+MONT+'[^\\d-]{0,30}'+MONT,'i'))))
      { out.montant = nbFac(m[2]); out.trouves.push('luMontant'); }
    else if((m = T2.match(new RegExp('total\\s*facture\\s*ttc[^\\d-]{0,20}'+MONT,'i'))))
      { out.montant = nbFac(m[1]); out.trouves.push('luMontant'); }
    if((m = T2.match(/total\s*ann[ée]e\s*\d{4}\s*:?\s*(\d[\d ]*)\s*m³/i)))
      { out.volume = nbFac(m[1]); out.trouves.push('luVolume'); }
    else if((m = T2.match(/consommation[^\d]{0,20}(\d[\d ]*)\s*m³/i)))
      { out.volume = nbFac(m[1]); out.trouves.push('luVolume'); }
    return out;
  }

  /* Électricité, mise en page EDF. La facture s'organise en trois blocs bornés
     par leurs totaux : Abonnement, Consommation, Taxes et Contributions. On
     travaille bloc par bloc plutôt qu'au fil du texte, sinon le premier montant
     rencontré après le mot « abonnement » est celui d'une autre rubrique. */
  /* Un bloc va du total qui le ferme jusqu'à l'en-tête qui l'ouvre, cherché en
     remontant. Se contenter d'une fenêtre de longueur fixe ferait déborder le
     bloc « Consommation » sur celui de l'abonnement, et la période lue serait
     celle d'une tranche d'abonnement. */
  const sec = (debRe, finRe, maxi) => {
    const j = T2.search(finRe);
    if(j < 0) return '';
    const fenetre = T2.slice(Math.max(0, j - maxi), j);
    const k = fenetre.search(debRe);
    return k < 0 ? fenetre : fenetre.slice(k);
  };
  const bAbo   = sec(/\bAbonnement\b/i, /Total\s+Abonnement/i, 1500);
  const bConso = sec(/Total\s+Abonnement/i, /Total\s+Consommation/i, 1500);
  const bTaxes = sec(/Taxes\s+et\s+Contributions/i, /Total\s+Taxes/i, 900);
  const DATE = '(\\d{1,2}\\/\\d{1,2}\\/(?:\\d{4}|\\d{2}))';
  const versISO = d => { const [j,mo,a] = d.split('/');
    return (a.length === 2 ? '20'+a : a) + '-' + mo.padStart(2,'0') + '-' + j.padStart(2,'0'); };

  // période réellement consommée, lue sur les lignes de consommation
  if((m = bConso.match(new RegExp('du\\s*'+DATE+'\\s*au\\s*'+DATE,'i')))){
    out.debut = versISO(m[1]); out.fin = versISO(m[2]);
    if(!out.trouves.includes('luPeriode')) out.trouves.push('luPeriode');
  }
  const prixDans = (bloc, mot) => {
    const r = new RegExp(mot+'[\\s\\S]{0,320}?(\\d[.,]\\d{4,6})','i');
    const x = bloc.match(r); return x ? nbFac(x[1]) : null;
  };
  const hc = prixDans(bConso, 'heures?\\s*creuses'), hp = prixDans(bConso, 'heures?\\s*pleines');
  if(hc != null){ out.hc = hc; out.trouves.push('luHC'); }
  if(hp != null){ out.hp = hp; out.trouves.push('luHP'); }
  const acc = prixDans(bTaxes, 'accise');
  if(acc != null){ out.accise = acc; out.trouves.push('luAccise'); }
  if((m = bTaxes.match(new RegExp('contribution\\s*tarifaire[\\s\\S]{0,160}?'+MONT,'i')))
  || (m = bTaxes.match(new RegExp('\\bCTA\\b[\\s\\S]{0,120}?'+MONT))))
    { out.cta = nbFac(m[1]); out.trouves.push('luCta'); }

  /* Abonnement : on prend le total tel qu'il est imprimé. EDF le découpe en
     tranches datées et facture d'avance la période suivante en remboursant
     l'avance précédente, si bien que ce total mélange trois périodes. Le
     répartir tel quel décale de quelques dizaines de centimes d'une facture à
     l'autre, mais reste explicable au locataire, qui lit le même chiffre que
     nous sur le document. Décision de la propriétaire, à ne pas défaire.
     À défaut de total lisible, on additionne les tranches de la période. */
  if((m = T2.match(new RegExp('Total\\s+Abonnement[^\\n]*\\n\\s*'+MONT,'i'))))
    { out.fixe = nbFac(m[1]); out.trouves.push('luFixe'); }
  else{
    const reAbo = new RegExp('([^\\n]*?)du\\s*'+DATE+'\\s*au\\s*'+DATE
      + '[^\\n]*\\n\\s*[\\d ]+,\\d{2}\\s*\\n\\s*(-?[\\d ]+,\\d{2})','gi');
    let abo = 0, tranches = 0;
    for(const x of bAbo.matchAll(reAbo)){
      if(/d[ée]duction/i.test(x[1])) continue;
      const a = versISO(x[2]), b = versISO(x[3]);
      if(out.debut && out.fin && !(a < out.fin && b > out.debut)) continue;
      abo += nbFac(x[4]); tranches++;
    }
    if(tranches){ out.fixe = Math.round(abo*100)/100; out.trouves.push('luFixe'); }
  }

  /* Consommation totale facturée, sur la ligne qui suit le total de la rubrique.
     La fin de texte compte comme une fin de ligne : sans cela le nombre n'est
     pas reconnu quand il termine le document, ce qui arrive dès que la rubrique
     Consommation est la dernière lue. */
  if((m = T2.match(/Total\s+Consommation[^\n]*\n\s*(\d[\d ]*?)\s*(?:\n|$)/i)))
    { out.volume = nbFac(m[1]); out.trouves.push('luVolume'); }
  /* Montant total, celui que la banque prélèvera. La ligne porte une date avant
     la somme, « Total facture TTC du 17/08/2026 276,62 » : on prend donc le
     dernier montant de la ligne. Les groupes de milliers font trois chiffres et
     rien ne peut commencer au milieu d'un nombre, sans quoi « 2026 276,62 » se
     lirait comme un seul montant. */
  const ligneTTC = (T2.match(/^.*Total\s+facture\s+TTC.*$/im) || [])[0];
  if(ligneTTC){
    const sommes = ligneTTC.match(/(?<![\d,.\/])\d{1,3}(?:[  ]\d{3})*,\d{2}/g);
    if(sommes){ out.montant = nbFac(sommes[sommes.length-1]); out.trouves.push('luMontant'); }
  }

  if((m = T2.match(/(\d{1,2})\s*kVA/i)))
    { out.kva = nbFac(m[1]); out.trouves.push('luKva'); }
  return out;
}

/* Texte d'un PDF sans bibliothèque. Trois pièges, et la façon de les éviter :

   1. La fin d'un flux se lit dans son dictionnaire, à /Length, et non en
      cherchant le mot « endstream ». Ces huit lettres apparaissent par hasard
      dans des données binaires, et le flux tronqué ne se décompresse plus.
   2. Un flux peut être compressé avec ou sans en-tête zlib, ou pas compressé
      du tout. On essaie les trois plutôt que d'abandonner à la première erreur.
   3. Une police embarquée contient elle aussi des parenthèses et parfois les
      lettres Tj. Seuls les flux qui ouvrent et ferment un bloc de texte, BT et
      ET, sont du contenu de page ; les autres sont écartés, sinon on ressort
      du charabia binaire en croyant avoir lu la facture. */
const deEchappe = x => x.replace(/\\(\d{1,3})/g, (_,o)=>String.fromCharCode(parseInt(o,8)))
                        .replace(/\\n/g,'\n').replace(/\\r/g,'\n').replace(/\\t/g,' ')
                        .replace(/\\([()\\])/g, '$1');
const deHexa = x => (x.replace(/[^0-9A-Fa-f]/g,'').match(/../g) || [])
  .map(p=>String.fromCharCode(parseInt(p,16))).join('');
const MORCEAU = /\((?:\\[\s\S]|[^\\()])*\)|<[0-9A-Fa-f\s]*>|-?\d+(?:\.\d+)?/g;

/* Un texte est jugé lisible si l'essentiel de ses caractères sont ceux qu'on
   trouve sur une facture. En dessous, la police utilise un encodage propre et
   les octets extraits ne sont pas des lettres. */
function lisible(s){
  const c = s.replace(/\s/g,'');
  if(c.length < 20) return false;
  // toute lettre de tout alphabet compte : la facture peut être en ukrainien
  const bons = (c.match(/[\p{L}\p{N}€%.,;:'’«»()\/\-+°³²×=]/gu) || []).length;
  return bons / c.length > 0.65;
}

/* Les filtres qu'une facture utilise réellement. Un flux peut en enchaîner
   plusieurs, typiquement ASCII85 puis Flate : n'en défaire qu'un seul laisse
   des octets illisibles qu'on prend à tort pour un document scanné. */
function deA85(s){
  s = s.replace(/^<~/,'').replace(/~>[\s\S]*$/,'').replace(/\s/g,'');
  const out = []; let t = 0, n = 0;
  for(const ch of s){
    if(ch === 'z' && n === 0){ out.push(0,0,0,0); continue; }
    const v = ch.charCodeAt(0) - 33;
    if(v < 0 || v > 84) continue;
    t = t*85 + v; n++;
    if(n === 5){ out.push((t>>>24)&255,(t>>>16)&255,(t>>>8)&255,t&255); t = 0; n = 0; }
  }
  if(n){
    for(let i=n;i<5;i++) t = t*85 + 84;
    const b = [(t>>>24)&255,(t>>>16)&255,(t>>>8)&255,t&255];
    for(let i=0;i<n-1;i++) out.push(b[i]);
  }
  return new Uint8Array(out);
}
function deAHx(s){
  const h = s.replace(/>[\s\S]*$/,'').replace(/[^0-9A-Fa-f]/g,'');
  const p = h.length % 2 ? h + '0' : h;
  return new Uint8Array((p.match(/../g) || []).map(x=>parseInt(x,16)));
}
async function deFlate(oct){
  for(const format of ['deflate','deflate-raw']){
    try{
      const flux = new Blob([oct]).stream().pipeThrough(new DecompressionStream(format));
      const b = await new Response(flux).arrayBuffer();
      if(b.byteLength) return new Uint8Array(b);
    }catch(e){}
  }
  return null;
}

const latin = oct => new TextDecoder('latin1').decode(oct);

/* Une table ToUnicode dit à quel caractère correspond chaque code de la police.
   Sans elle, un sous-ensemble de police rend « \001\002\003 » là où la page
   affiche « EDF » : le texte est présent, mais dans un alphabet privé. */
const enUtf16 = hx => (hx.match(/..../g) || [])
  .map(x=>String.fromCharCode(parseInt(x,16))).join('');
function lireCMap(txt){
  const map = new Map(); let large = false;
  const cs = /begincodespacerange([\s\S]*?)endcodespacerange/.exec(txt);
  if(cs && /<([0-9A-Fa-f]{3,})>/.test(cs[1])) large = true;
  let reste = txt;
  // forme à liste : <lo> <hi> [ <d1> <d2> … ], traitée d'abord puis effacée,
  // sinon ses trois premiers éléments se lisent comme une forme à base
  reste = reste.replace(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*\[([\s\S]*?)\]/g, (_,lo,hi,liste)=>{
    if(lo.length > 2) large = true;
    let k = parseInt(lo,16);
    for(const d of liste.matchAll(/<([0-9A-Fa-f]*)>/g)) map.set(k++, enUtf16(d[1]));
    return ' ';
  });
  for(const b of reste.matchAll(/beginbfchar([\s\S]*?)endbfchar/g))
    for(const m of b[1].matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]*)>/g)){
      if(m[1].length > 2) large = true;
      map.set(parseInt(m[1],16), enUtf16(m[2]));
    }
  for(const b of reste.matchAll(/beginbfrange([\s\S]*?)endbfrange/g))
    for(const m of b[1].matchAll(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]*)>/g)){
      if(m[1].length > 2) large = true;
      const lo = parseInt(m[1],16), hi = parseInt(m[2],16), base = parseInt(m[3],16);
      const larg = m[3].length;
      for(let c=lo; c<=hi && c-lo < 65536; c++)
        map.set(c, enUtf16((base + (c-lo)).toString(16).padStart(larg,'0')));
    }
  return map.size ? {map, large} : null;
}
function versTexte(brut, cm){
  if(!cm) return brut;
  let out = '';
  if(cm.large){
    for(let i=0;i+1<brut.length;i+=2){
      const c = (brut.charCodeAt(i)<<8) | brut.charCodeAt(i+1);
      out += cm.map.has(c) ? cm.map.get(c) : '';
    }
  }else{
    for(let i=0;i<brut.length;i++){
      const c = brut.charCodeAt(i);
      out += cm.map.has(c) ? cm.map.get(c)
           : (c === 32 ? ' ' : (c > 32 && c < 127 ? brut[i] : ''));
    }
  }
  return out;
}

/* Jetons utiles d'un flux de contenu : police, déplacement du curseur, texte.
   EDF écrit un glyphe par opération, avec un déplacement explicite entre
   chacun. Ajouter un espace après chaque opération donnerait « D o c u m e n t ».
   Les mots ne se déduisent donc pas du découpage des opérations mais de la
   position : un saut vertical fait une ligne, un saut horizontal plus large
   qu'une lettre fait un espace, et les espaces réels sont écrits tels quels. */
const N = '(-?[\\d.]+)';
const JETONS = new RegExp(
  '\\/([^\\s\\/<>\\[\\]()]+)\\s+' + N + '\\s+Tf'
+ '|' + N + '\\s+' + N + '\\s+T[dD]\\b'
+ '|' + [N,N,N,N,N,N].join('\\s+') + '\\s+Tm\\b'
+ '|\\((?:\\\\[\\s\\S]|[^\\\\()])*\\)\\s*(?:Tj|\'|")'
+ '|<[0-9A-Fa-f\\s]*>\\s*(?:Tj|\'|")'
+ '|\\[[^\\]]*\\]\\s*TJ'
+ '|\\bT\\*|\\bBT\\b|\\bET\\b', 'g');

async function texteDuPdf(buf){
  const oct = new Uint8Array(buf);
  let bin = ''; for(let i=0;i<oct.length;i++) bin += String.fromCharCode(oct[i]);

  // position de chaque objet, pour suivre les renvois « 12 0 R »
  const objets = {};
  for(const m of bin.matchAll(/(\d+)\s+\d+\s+obj\b/g)) objets[m[1]] = m.index;

  const finDico = pos => {
    const i = bin.indexOf('<<', pos);
    if(i < 0) return [-1,-1];
    let p = 0;
    for(let k=i;k<bin.length-1;k++){
      if(bin[k]==='<' && bin[k+1]==='<'){ p++; k++; }
      else if(bin[k]==='>' && bin[k+1]==='>'){ p--; k++; if(!p) return [i,k+1]; }
    }
    return [-1,-1];
  };
  const dicoDe = num => {
    const o = objets[num]; if(o == null) return '';
    const [a,b] = finDico(o);
    return a < 0 ? '' : bin.slice(a,b);
  };
  const nombreDe = num => {
    const o = objets[num]; if(o == null) return null;
    const m = /obj\s+(\d+)/.exec(bin.slice(o, o+60));
    return m ? +m[1] : null;
  };

  /* Contenu décodé d'un objet flux : longueur lue dans le dictionnaire, puis
     les filtres défaits dans l'ordre où ils sont déclarés. */
  const fluxDe = async num => {
    const o = objets[num]; if(o == null) return null;
    const [a,b] = finDico(o); if(a < 0) return null;
    const dico = bin.slice(a,b);
    const ms = /stream\r?\n?/.exec(bin.slice(b, b+40));
    if(!ms) return null;
    const d = b + ms.index + ms[0].length;
    let lg = null;
    const dl = /\/Length\s+(\d+)(?!\s+\d+\s+R)/.exec(dico);
    const di = /\/Length\s+(\d+)\s+\d+\s+R/.exec(dico);
    if(dl) lg = +dl[1]; else if(di) lg = nombreDe(di[1]);
    let f = (lg != null && d + lg <= bin.length
             && /^\s*endstream/.test(bin.slice(d+lg, d+lg+12))) ? d + lg : -1;
    if(f < 0){
      f = bin.indexOf('endstream', d);
      if(f < 0) return null;
      while(f > d && (bin[f-1] === '\n' || bin[f-1] === '\r')) f--;
    }
    let data = oct.slice(d, f);
    const fm = /\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/.exec(dico);
    const filtres = fm ? (fm[1].match(/\/([A-Za-z0-9]+)/g) || []).map(x=>x.slice(1)) : [];
    for(const filtre of filtres){
      if(filtre === 'ASCII85Decode')      data = deA85(latin(data));
      else if(filtre === 'ASCIIHexDecode') data = deAHx(latin(data));
      else if(filtre === 'FlateDecode'){
        const z = await deFlate(data);
        if(!z) return null;
        data = z;
      }else return null;                  // filtre non géré, image le plus souvent
    }
    return latin(data);
  };

  // tables ToUnicode, rangées par nom de police tel qu'il apparaît dans les pages
  const cmaps = {};
  const entrees = t => { const o = {};
    for(const e of t.matchAll(/\/([^\s\/<>]+)\s+(\d+)\s+\d+\s+R/g)) o[e[1]] = e[2];
    return o; };
  const polices = {};
  for(const m of bin.matchAll(/\/Font\s*<<([\s\S]{0,4000}?)>>/g))
    Object.assign(polices, entrees(m[1]));
  for(const m of bin.matchAll(/\/Font\s+(\d+)\s+\d+\s+R/g))
    Object.assign(polices, entrees(dicoDe(m[1])));
  for(const nom in polices){
    const d = dicoDe(polices[nom]);
    const tu = /\/ToUnicode\s+(\d+)\s+\d+\s+R/.exec(d);
    if(!tu) continue;
    const c = await fluxDe(tu[1]);
    if(c) cmaps[nom] = lireCMap(c);
  }

  // parcours des flux de contenu
  let txt = '', flux = 0, contenus = 0, avecTable = 0;
  for(const num in objets){
    flux++;
    const c = await fluxDe(num);
    if(!c || !(/\bBT\b/.test(c) && /\bET\b/.test(c) && /\bT[jJ]\b/.test(c))) continue;
    contenus++;
    let cm = null, taille = 10, y = null, x = null, ecrit = false;
    const saut = () => { if(ecrit){ txt += '\n'; ecrit = false; } };
    for(const g of c.matchAll(JETONS)){
      const jeton = g[0];
      if(g[1] != null){                                  // police
        cm = cmaps[g[1]] || null; if(cm) avecTable++;
        taille = Math.abs(+g[2]) || taille;
        continue;
      }
      if(g[3] != null){                                  // déplacement relatif
        const tx = +g[3], ty = +g[4];
        if(ty !== 0) saut();
        else if(ecrit && tx > taille*1.6) txt += ' ';    // saut de colonne
        continue;
      }
      if(g[5] != null){                                  // matrice de texte
        const nx = +g[9], ny = +g[10];
        if(y != null && Math.abs(ny - y) > taille*0.4) saut();
        else if(ecrit && x != null && nx - x > taille*1.6) txt += ' ';
        x = nx; y = ny;
        continue;
      }
      if(jeton === 'BT' || jeton === 'ET' || jeton === 'T*'){
        saut(); if(jeton === 'BT'){ y = null; x = null; }
        continue;
      }
      let bout = '';
      for(const m of jeton.match(MORCEAU) || []){
        if(m[0] === '(')      bout += versTexte(deEchappe(m.slice(1,-1)), cm);
        else if(m[0] === '<') bout += versTexte(deHexa(m), cm);
        else if(+m < -120)    bout += ' ';   // un grand recul sépare deux mots
      }
      if(bout){ txt += bout; if(bout.trim()) ecrit = true; }
    }
    txt += '\n';
  }
  const propre = txt.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  return {txt: propre, flux, contenus, avecTable,
          etat: !contenus || !propre ? 'vide' : (lisible(propre) ? 'ok' : 'illisible')};
}

/* ── menus déroulants ────────────────────────────────── */
function habillerSelects(racine){
  racine.querySelectorAll('select:not([data-hab])').forEach(sel=>{
    sel.dataset.hab = '1';
    let boite = sel.parentNode;
    if(!boite.classList.contains('ds')){
      boite = document.createElement('div');
      boite.className = 'ds';
      sel.parentNode.insertBefore(boite, sel);
      boite.appendChild(sel);
    }
    const bouton = document.createElement('button');
    bouton.type = 'button'; bouton.className = 'ds-b';
    bouton.setAttribute('aria-haspopup','listbox');
    bouton.setAttribute('aria-expanded','false');
    bouton.innerHTML = `<span></span>${ico('chevron',15)}`;
    const liste = document.createElement('div');
    liste.className = 'ds-l'; liste.hidden = true; liste.setAttribute('role','listbox');
    boite.append(bouton, liste);

    const majTexte = ()=>{ const o = sel.options[sel.selectedIndex];
      bouton.firstElementChild.textContent = o ? o.textContent : ''; };
    const peupler = ()=>{
      liste.innerHTML = '';
      Array.from(sel.options).forEach((o,i)=>{
        const d = document.createElement('div');
        d.className = 'ds-o' + (i === sel.selectedIndex ? ' on' : '');
        d.setAttribute('role','option');
        d.innerHTML = `<i>${i === sel.selectedIndex ? '✓' : ''}</i>${esc(o.textContent)}`;
        d.onclick = ()=>{ sel.selectedIndex = i; majTexte();
          sel.dispatchEvent(new Event('change', {bubbles:true})); ferme(); };
        liste.appendChild(d);
      });
    };
    const ferme = ()=>{ liste.hidden = true; bouton.setAttribute('aria-expanded','false');
      document.removeEventListener('mousedown', dehors, true); };
    const dehors = e => { if(!boite.contains(e.target)) ferme(); };
    const ouvre = ()=>{ peupler(); liste.hidden = false;
      bouton.setAttribute('aria-expanded','true');
      document.addEventListener('mousedown', dehors, true);
      const sur = liste.querySelector('.on'); if(sur) sur.scrollIntoView({block:'nearest'}); };

    bouton.onclick = ()=> liste.hidden ? ouvre() : ferme();
    bouton.onkeydown = e => {
      if(e.key === 'Escape') return ferme();
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
        e.preventDefault();
        const n = sel.options.length; if(!n) return;
        sel.selectedIndex = (sel.selectedIndex + (e.key === 'ArrowDown' ? 1 : n-1)) % n;
        majTexte(); sel.dispatchEvent(new Event('change', {bubbles:true}));
      }
    };
    majTexte();
  });
}

/* Pied de page : l'impression du décompte, et repliées, les commandes de
   sauvegarde. Rien de tout cela n'appartient au fil de la répartition, qui doit
   se lire d'une traite jusqu'au total. */
function vuePied(){
  const pied = $('#pied'); if(!pied) return;
  const c = S.calcul[FL];
  const per = periodesMesurees(FL);
  const r = per.length ? calculer(FL, c.debut, c.fin) : {erreur:1};
  pied.innerHTML = (r.erreur ? '' :
      `<p class="impr" style="margin:0"><a href="#" id="p-doc">${t('imprimer')}</a></p>`)
    + blocSauvegarde();
  const bd = $('#p-doc');
  if(bd) bd.onclick = e => { e.preventDefault(); imprimer(docPour(r)); };
  brancherSauvegarde();
}

  $('#h-titre').textContent = titreFluide(FL);
  $('#i-drop').innerHTML = ico(FLUIDES[FL].icone, 24);
  const lib = {repartition:t('tRepartition'), conso:t('tConso'), donnees:t('tDonnees')};
  document.querySelectorAll('nav.tabs button').forEach(b=> b.textContent = lib[b.dataset.vue]);
  document.querySelectorAll('#bascule button').forEach(b=>{
    b.innerHTML = ico(FLUIDES[b.dataset.fluide].icone, 15) + ' '
      + t(b.dataset.fluide === 'eau' ? 'fEau' : 'fElec');
    b.classList.toggle('on', b.dataset.fluide === FL);
  });
  $('#rel-plus').innerHTML = ico('plus',15) + ' ' + t('saisieReleve');
  $('#fac-plus').innerHTML = ico('plus',15) + ' ' + t('saisieFacture');
  rafraichir();
}
$('#i-globe').innerHTML = ico('globe',15);
document.body.dataset.fluide = FL;
setLang(LANG);

/* Mise en réserve pour l'usage hors ligne. Échoue sans bruit hors d'un serveur :
   la page reste parfaitement utilisable ouverte depuis un fichier. */
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
