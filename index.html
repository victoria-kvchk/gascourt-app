<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charges du corps de ferme, Gascourt</title>
<meta name="theme-color" content="#2a78d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gascourt">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" href="icone-192.png" type="image/png">
<style>
  /* Palette catégorielle validée en mode clair, tous couples confrontés :
     CVD ΔE 9,2 · vision normale ΔE 16,3. Chaque couleur est doublée du nom
     du logement en toutes lettres, ce qui lève la réserve de contraste. */
  :root{
    color-scheme: light;
    --page:#f4f5f7; --card:#ffffff; --line:#e6e9ee;
    --ink:#111827; --ink-2:#4b5563; --ink-3:#8b93a1;
    --accent:#2a78d6; --accent-soft:#eaf2fc;
    --warn:#8a5a00; --warn-bg:#fdf4e3; --err:#a4241f; --err-bg:#fbecea;
    --c0:#2a78d6; --c0bg:#eef4fd;
    --c1:#1baf7a; --c1bg:#e9f7f1;
    --c2:#4a3aa7; --c2bg:#eeecf8;
    --c3:#eb6834; --c3bg:#fdf0ea;
    /* les deux cadrans du compteur électrique, repris du calculateur d'origine */
    --hc:#2a78d6; --hp:#eb6834;
  }
  /* L'électricité prend une teinte propre, pour qu'on sache d'un coup d'œil
     de quel fluide on parle sans lire l'onglet. */
  body[data-fluide="elec"]{ --accent:#b8720c; --accent-soft:#fdf3e4; }
  *{box-sizing:border-box}
  body{margin:0; background:var(--page); color:var(--ink);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1120px; margin:0 auto; padding:26px 20px 70px}
  .num{font-variant-numeric:tabular-nums}

  .head{background:var(--card); border:1px solid var(--line); border-radius:18px;
        padding:22px 26px; margin-bottom:18px}
  .hrow{display:flex; align-items:center; gap:18px}
  .hrow.barre{margin-top:20px; gap:12px}
  .drop{width:46px; height:46px; border-radius:12px; background:var(--accent); color:#fff;
        display:flex; align-items:center; justify-content:center; font-size:23px; flex:none;
        transition:background .18s}
  .head h1{font-size:29px; margin:0 0 6px; letter-spacing:-.02em; line-height:1.15}
  .head p{margin:0; color:var(--ink-2); font-size:14.5px; max-width:62ch}
  .langs{margin-left:auto; display:flex; gap:6px; flex:none}
  .langs button{border:1px solid var(--line); background:var(--card); color:var(--ink-2);
    padding:7px 15px; border-radius:99px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer}
  .langs button.on{background:var(--accent); border-color:var(--accent); color:#fff}

  /* bascule entre les deux fluides : c'est elle qui commande toute la page */
  .fluides{display:flex; gap:5px; background:var(--page); border:1px solid var(--line);
    border-radius:99px; padding:4px; flex:none}
  .fluides button{border:none; background:none; color:var(--ink-2); padding:7px 16px;
    border-radius:99px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px}
  .fluides button:hover{color:var(--ink)}
  .fluides button.on{background:var(--card); color:var(--accent);
    box-shadow:0 1px 3px rgba(17,24,39,.1)}

  nav.tabs{display:flex; flex-wrap:wrap; gap:26px}
  nav.tabs button{border:none; background:none; color:var(--ink-3); padding:9px 1px;
    border-bottom:2px solid transparent; border-radius:0; font:inherit; font-size:15px;
    font-weight:600; cursor:pointer}
  nav.tabs button:hover{color:var(--ink-2)}
  nav.tabs button.on{color:var(--accent); border-bottom-color:var(--accent)}

  .block{background:var(--card); border:1px solid var(--line); border-radius:18px;
         padding:22px 26px 26px; margin-bottom:18px}
  .bhead{display:flex; align-items:center; gap:13px; margin-bottom:16px}
  .badge{width:30px; height:30px; color:var(--accent); display:flex; align-items:center;
         justify-content:center; flex:none}
  .bhead h2{font-size:21px; margin:0 0 2px; letter-spacing:-.02em}
  .bhead p{margin:0; color:var(--ink-3); font-size:13.5px}
  .perio{display:grid; grid-template-columns:auto 1fr; gap:2px 11px; align-items:center;
    margin:0 0 0 auto; padding:10px 15px; border:1px solid var(--line); border-radius:13px;
    background:var(--card); cursor:pointer; text-transform:none; letter-spacing:0; min-width:340px}
  .perio .ic{grid-row:1/3; color:var(--ink-3); display:flex}
  .perio .lb{font-size:12px; color:var(--ink-3)}
  .perio .ds{grid-column:2}
  .perio .ds-b{border:none; background:none; padding:0; font-size:15px; font-weight:600}
  .perio .ds-b:hover{background:none}
  .perio:hover{border-color:var(--accent)}

  th .mt{white-space:nowrap; opacity:.72; font-weight:500}
  /* le nom de la facture garde ses mots ensemble tant que la place le permet */
  table td:first-child{text-wrap:balance}
  .tarifLigne{margin:0 0 14px; color:var(--ink-2); font-size:13.5px}
  .tarifLigne a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent); margin-left:8px}
  .total{display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    margin-top:16px; padding:14px 18px; background:var(--accent-soft); border-radius:12px}
  .total span{font-size:13px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em; font-weight:600}
  .total b{font-size:24px; letter-spacing:-.02em}

  .quad{display:grid; grid-template-columns:repeat(4,1fr); gap:13px}
  @media(max-width:980px){.quad{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:560px){.quad{grid-template-columns:1fr}}
  .lgt{border:1px solid var(--line); border-radius:13px; overflow:hidden;
      background:var(--card); display:flex; flex-direction:column}
  .lgt .top{display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line)}
  .lgt .ico{width:26px; height:26px; border-radius:7px; display:flex; align-items:center;
           justify-content:center; font-size:14px; color:#fff; flex:none}
  .lgt .top b{font-size:15px; letter-spacing:-.01em}
  .lgt .body{padding:12px 14px; flex:1}
  .kv{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:4px 0;
      align-items:baseline}
  .kv span{color:var(--ink-3); min-width:0}
  .kv b{font-weight:600; white-space:nowrap}
  .kv.gras span{color:var(--ink)} .kv.gras b{font-weight:700}
  /* dates de la période en tête de carte : sans libellé, il n'y a pas la place
     pour les deux et l'un chevaucherait l'autre */
  .datescarte{font-size:11.5px; color:var(--ink-3); margin:1px 0 7px}
  .idx{display:flex; gap:8px; margin:9px 0 4px}
  .idx>div{flex:1; background:var(--page); border:1px solid var(--line); border-radius:8px; padding:6px 9px}
  .idx .lab{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em}
  .idx .v{font-size:13.5px; font-weight:600}
  .lgt .foot{display:flex; border-top:1px solid var(--line); margin-top:auto}
  .lgt .foot>div{flex:1; padding:10px 14px}
  .lgt .foot>div+div{border-left:1px solid var(--line)}
  .lgt .foot .lab{font-size:10.5px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
  .lgt .foot .v{font-size:16px; font-weight:700; letter-spacing:-.01em}
  /* sous-compteur d'un logement, replié sous le compteur principal */
  .souscpt{margin:8px 0 2px; padding:8px 10px; background:var(--page);
    border:1px solid var(--line); border-radius:9px}
  .cad{display:inline-flex; align-items:center; gap:5px}
  .cad i{width:8px; height:8px; border-radius:50%; display:inline-block; flex:none}
  .cad i.hc{background:var(--hc)} .cad i.hp{background:var(--hp)}

  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{padding:13px 12px; text-align:right; border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{font-size:11px; color:#8b96ab; text-transform:uppercase; letter-spacing:.06em;
     font-weight:600; padding-bottom:12px}
  tbody tr:last-child td{border-bottom:none}
  /* un montant ne se coupe pas : « 0,03085 » sur une ligne et « € » sur la
     suivante se lit comme deux valeurs différentes */
  td.num{white-space:nowrap}
  tbody tr.cliquable{cursor:pointer}
  tbody tr.cliquable:hover td{background:var(--accent-soft)}
  tr.tot td{font-weight:700; background:var(--accent-soft); border:none}
  tr.tot td:first-child{border-radius:10px 0 0 10px}
  tr.tot td:last-child{border-radius:0 10px 10px 0}
  .scroll{overflow-x:auto}
  .msg{padding:11px 15px; border-radius:10px; font-size:14px; margin-bottom:12px}
  .msg.warn{background:var(--warn-bg); color:var(--warn)}
  .msg.err{background:var(--err-bg); color:var(--err)}
  .msg.info{background:var(--accent-soft); color:var(--accent)}

  label{display:block; font-size:11.5px; color:var(--ink-3); text-transform:uppercase;
        letter-spacing:.05em; margin-bottom:4px}
  textarea{resize:vertical; min-height:74px; line-height:1.45}
  input,select,textarea{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--card); color:var(--ink); font:inherit; font-size:14px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  input[readonly]{background:var(--page); color:var(--ink-2)}
  /* Menu déroulant maison : la liste native est rendue par le système et
     n'accepte aucun style. Le <select> reste dans la page, masqué, pour que
     le code existant continue de lire sa valeur. */
  .ds{position:relative; width:100%}
  .ds select{display:none}
  .ds-b{width:100%; display:flex; align-items:center; gap:8px; text-align:left;
    padding:9px 11px; border:1px solid var(--line); border-radius:9px; background:var(--card);
    color:var(--ink); font:inherit; font-size:14px; cursor:pointer}
  .ds-b:hover{border-color:var(--accent)}
  .ds-b[aria-expanded="true"]{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .ds-b span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ds-b svg{flex:none; color:var(--ink-3); transition:transform .15s}
  .ds-b[aria-expanded="true"] svg{transform:rotate(180deg)}
  .ds-l{position:absolute; z-index:80; top:calc(100% + 5px); left:0; min-width:100%;
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:5px;
    box-shadow:0 14px 38px rgba(17,24,39,.16); max-height:280px; overflow:auto}
  .ds-o{padding:8px 11px; border-radius:8px; font-size:14px; cursor:pointer;
    display:flex; align-items:center; gap:8px; white-space:nowrap}
  .ds-o:hover,.ds-o.sur{background:var(--accent-soft); color:var(--accent)}
  .ds-o.on{font-weight:600}
  .ds-o i{width:14px; flex:none; font-style:normal; color:var(--accent)}

  .grid{display:grid; gap:12px}
  .g2{grid-template-columns:repeat(2,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  @media(max-width:720px){.g2,.g4{grid-template-columns:1fr}}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:16px}
  button.act{border:1px solid var(--accent); background:var(--accent); color:#fff;
    padding:10px 20px; border-radius:99px; font:inherit; font-weight:600; font-size:14px; cursor:pointer}
  button.act:hover{filter:brightness(1.07)}
  button.ghost{border:1px solid var(--line); background:var(--card); color:var(--ink-2);
    padding:10px 18px; border-radius:99px; font:inherit; font-size:14px; cursor:pointer}
  button.ghost:hover{border-color:var(--accent); color:var(--accent)}
  button.mini{border:1px solid var(--line); background:var(--card); color:var(--ink-3);
    padding:4px 12px; border-radius:99px; font:inherit; font-size:12px; cursor:pointer}
  button.mini:hover{border-color:var(--accent); color:var(--accent)}
  h4{font-size:12px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em;
     margin:24px 0 10px; font-weight:600}
  .vide{color:var(--ink-3); font-size:14px; font-style:italic; padding:14px 0}
  .signaler{margin:12px 0 0; font-size:12.5px}
  .signal{display:flex; gap:12px; align-items:flex-start; background:var(--warn-bg);
    border-radius:10px; padding:11px 14px; margin-bottom:8px; font-size:13.5px; color:var(--ink)}
  .signal>div{flex:1}
  .signal button{flex:none}
  .signaler a{color:var(--ink-3); text-decoration:none; border-bottom:1px dotted var(--ink-3)}
  .signaler a:hover{color:var(--accent); border-color:var(--accent)}
  .import{border:1px dashed var(--line); border-radius:12px; padding:14px 16px; margin-bottom:18px}
  .import textarea{margin-top:10px}
  .voile{position:fixed; inset:0; z-index:60; background:rgba(17,24,39,.45);
    display:flex; align-items:flex-start; justify-content:center; padding:44px 20px; overflow:auto}
  .voile .panneau{background:var(--card); border-radius:18px; padding:24px 28px 28px;
    width:100%; max-width:780px; box-shadow:0 24px 70px rgba(0,0,0,.28)}
  .voile .panneau:has(.pdfvue){max-width:940px}
  .pdfvue{width:100%; height:62vh; min-height:380px; border:1px solid var(--line);
    border-radius:12px; background:var(--page)}

  /* champs modifiables au fil du texte : discrets tant qu'on ne les touche pas */
  .edit{border:1px solid transparent; background:transparent; padding:2px 5px; border-radius:6px;
        font:inherit; color:inherit; width:auto}
  .edit:hover{border-color:var(--line); background:rgba(255,255,255,.75)}
  .edit:focus{background:var(--card); border-color:var(--accent); outline:none}
  .edit.nom{font-size:15px; font-weight:700; letter-spacing:-.01em; flex:1; min-width:0}
  .edit.surf{width:66px; text-align:right; font-weight:600; font-size:13.5px}
  .edit.surf::-webkit-outer-spin-button,.edit.surf::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
  .englobe{margin:12px 0 0; color:var(--ink-2); font-size:13.5px}
  .sep2{border-top:1px solid var(--line); margin:8px 0 6px}
  .plus{border:1px solid var(--line); background:var(--card); color:var(--accent);
    padding:9px 18px; border-radius:99px; font:inherit; font-size:14px; font-weight:600; cursor:pointer}
  .plus:hover{border-color:var(--accent); background:var(--accent-soft)}
  .bhead .plus{margin-left:auto}
  .plus, .langs button{display:inline-flex; align-items:center; gap:7px}
  .badge svg, .lgt .ico svg{display:block}

  /* ── consommation dans le temps ─────────────────────── */
  .hfiltres{display:flex; flex-wrap:wrap; align-items:center; gap:11px 22px; margin-bottom:18px}
  .hf{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-2); white-space:nowrap}
  .hf .ds{width:auto; min-width:190px}
  .seg{display:flex; gap:4px; background:var(--page); border:1px solid var(--line);
    border-radius:99px; padding:3px}
  .seg button{border:none; background:none; color:var(--ink-2); padding:6px 14px;
    border-radius:99px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
  .seg button.on{background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(17,24,39,.1)}
  .hnote{font-size:12.5px; color:var(--ink-3); flex:1 1 240px; min-width:0; white-space:normal}
  .figure{margin:0 0 18px; display:flex; flex-direction:column; gap:12px}
  .figure figcaption{font-size:13px; color:var(--ink-2); font-weight:700}
  .legende{display:flex; flex-wrap:wrap; gap:7px 18px; font-size:12.5px; color:var(--ink-2)}
  .lgd{display:flex; align-items:center; gap:7px}
  .sw{width:11px; height:11px; border-radius:3px; flex:none}
  .sw.hc{background:var(--hc)} .sw.hp{background:var(--hp)} .sw.u{background:var(--accent)}
  .chart{position:relative; height:240px; padding:20px 0 46px 58px}
  .cgrid{position:absolute; inset:20px 0 46px 58px; pointer-events:none}
  .cgline{position:absolute; left:0; right:0; border-top:1px solid var(--line)}
  .cgval{position:absolute; right:calc(100% + 9px); transform:translateY(-50%); font-size:10.5px;
    color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
  .cbars{position:relative; height:100%; display:flex; align-items:flex-end; gap:8px}
  .cbar{position:relative; flex:1 1 0; min-width:0; height:100%; display:flex;
    flex-direction:column; justify-content:flex-end}
  .cstack{display:flex; flex-direction:column; justify-content:flex-end; height:100%;
    max-width:72px; margin:0 auto; width:100%}
  .cseg{width:100%; min-height:2px}
  .cseg.hp{background:var(--hp); border-radius:5px 5px 0 0; margin-bottom:2px}
  .cseg.hp.flush{margin-bottom:0}
  .cseg.hc{background:var(--hc)}
  .cseg.hc.solo{border-radius:5px 5px 0 0}
  .cseg.u{background:var(--accent); border-radius:5px 5px 0 0}
  .ctot{position:absolute; left:0; right:0; text-align:center; font-size:10.5px; font-weight:700;
    color:var(--ink-2); font-variant-numeric:tabular-nums; pointer-events:none}
  .clab{position:absolute; top:calc(100% + 8px); left:-3px; right:-3px; text-align:center;
    font-size:10.5px; color:var(--ink-3); line-height:1.3; overflow-wrap:anywhere}
  .cbar:hover .cstack{filter:brightness(1.1)}
  .ctip{position:absolute; z-index:30; pointer-events:none; opacity:0; transform:translate(-50%,-100%);
    background:var(--ink); color:#fff; border-radius:9px; padding:9px 12px; font-size:12.5px;
    line-height:1.55; white-space:nowrap; box-shadow:0 10px 26px rgba(0,0,0,.3); transition:opacity .12s}
  .ctip.on{opacity:1}
  .ctip b{font-variant-numeric:tabular-nums}
  .ctip .tk{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px}

  footer{color:var(--ink-3); font-size:12.5px; margin-top:26px}
  #pied{display:flex; flex-direction:column; gap:14px; padding:4px 2px 0}
  #pied a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent)}
  #pied .impr{font-size:14px}
  #pied details summary{cursor:pointer; font-weight:600; color:var(--ink-2);
    list-style:none; padding:6px 0}
  #pied details summary::-webkit-details-marker{display:none}
  #pied details summary::before{content:"+ "; color:var(--accent); font-weight:700}
  #pied details[open] summary::before{content:"− "}
  #pied details .corps{border-top:1px solid var(--line); padding-top:12px; margin-top:4px}
  #pied .auto{max-width:70ch}
  #pied .englobe{margin:8px 0 0; max-width:70ch}
  #pied .englobe.alerte{color:var(--warn)}
  #pied input{max-width:none}
  @media(max-width:640px){
    .block{padding:20px 18px 22px; border-radius:14px}
    .chart{height:215px; padding-left:48px} .cgrid{left:48px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none !important}}


  /* ── au doigt, sur un téléphone ─────────────────────────
     L'app sert d'abord à saisir des index devant un compteur, donc debout, à
     une main, sur un écran de moins de 400 points. Ce qui suit ne rétrécit pas
     l'affichage de bureau : ce sont des règles qui ne s'appliquent qu'en deçà. */
  @media (max-width:760px){
    .wrap{padding:14px 12px 56px}
    .head{padding:16px 16px; border-radius:14px; margin-bottom:14px}
    .head h1{font-size:22px; line-height:1.2}
    .head .hrow{flex-wrap:wrap; gap:12px}
    .drop{width:38px; height:38px; border-radius:10px}
    /* la langue passe sous le titre plutôt que de l'écraser */
    .langs{margin-left:0; order:3; width:100%}
    .langs button{flex:1; justify-content:center}
    .hrow.barre{flex-wrap:wrap; gap:10px; margin-top:14px}
    .fluides{width:100%}
    .fluides button{flex:1; justify-content:center}
    /* les onglets défilent au doigt au lieu de se replier sur deux lignes */
    nav.tabs{width:100%; gap:20px; overflow-x:auto; flex-wrap:nowrap;
      scrollbar-width:none; -webkit-overflow-scrolling:touch}
    nav.tabs::-webkit-scrollbar{display:none}
    nav.tabs button{white-space:nowrap; flex:none}
    /* les deux boutons se partagent une rangée : le style en ligne fixe
       flex:none, il faut le forcer ici */
    #rel-plus, #fac-plus{flex:1 1 0 !important; min-width:0;
      margin-left:0 !important; justify-content:center}
    .block{padding:16px 14px 18px; border-radius:14px; margin-bottom:14px}
    .bhead{flex-wrap:wrap; gap:10px}
    .bhead h2{font-size:18px}
    /* le sélecteur de période prenait 340 points de large, il débordait */
    .perio{min-width:0; width:100%; margin:0}
    /* La saisie devient une feuille qui remonte du bas.

       du formulaire s'y cache, et comme le navigateur croit que tout tient, il
       n'offre aucun défilement. dvh mesure ce qui est réellement visible, et
       c'est le panneau lui-même qui défile. */

      height:100vh; height:100dvh}
    .voile .panneau{width:100%; max-width:none; border-radius:16px 16px 0 0;
      max-height:100vh; max-height:94dvh; overflow-y:auto;
      overscroll-behavior:contain; -webkit-overflow-scrolling:touch;
      padding:18px 14px 0}

      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
      border-top:1px solid var(--line)}
    #modal .panneau > div:last-child{padding-bottom:14px}
    .total{flex-wrap:wrap; gap:6px}
    .total b{font-size:21px}
    h4{margin:18px 0 8px}

       visible pendant qu'on fait défiler les chiffres : sans elle on ne sait
       plus de quelle ligne on lit la valeur. */
    .scroll{overflow-x:auto; -webkit-overflow-scrolling:touch}
    .scroll th:first-child, .scroll td:first-child{
      position:sticky; left:0; background:var(--card); z-index:2}

    th,td{padding:10px 9px}
  }

/* ── les deux fluides ────────────────────────────────── */
/* Tout ce qui les distingue tient ici : le nombre de cadrans du compteur, le
   nom de l'unité, et la précision d'affichage. Le reste du programme ne
   connaît que « le fluide en cours » et ne teste jamais lequel c'est, sauf
   là où la facture elle-même diffère vraiment. */
/* fixeEntier : l'abonnement se répartit-il en entier ou au prorata des jours ?
   SAUR facture des semestres d'avance, sans rapport avec les dates de relevé :
   il faut les ramener au jour. EDF facture la période qu'il vient de relever,
   qui tombe dans une seule période de relevé : la découper au jour donnerait un
   montant introuvable sur la facture, sans rien gagner en justesse. */
/* suivi : afficher ou non la comparaison entre kWh facturés et kWh mesurés.
   Réservée à l'électricité sur décision de la propriétaire, le dossier de l'eau
   étant traité à part. Passer eau à true suffirait à l'activer là aussi. */
const FLUIDES = {
  eau:  {cadrans:['u'],        dec:3, decPrix:4, icone:'goutte', pref:'eau',  fixeEntier:false, suivi:false},
  elec: {cadrans:['hc','hp'],  dec:0, decPrix:5, icone:'eclair', pref:'el',   fixeEntier:true,  suivi:true}
};
let FL = localStorage.getItem(KEY+'-fluide') || 'eau';
const cadrans  = (f=FL) => FLUIDES[f].cadrans;
const unite    = (f=FL) => t(f === 'eau' ? 'uEau' : 'uElec');
const nomCadran = (c) => c === 'u' ? t('cadU') : c === 'hc' ? t('cadHC') : t('cadHP');
const nomCadranCourt = (c) => c === 'u' ? t('cadU') : c === 'hc' ? t('cadHCcourt') : t('cadHPcourt');

/* ── données de départ ───────────────────────────────────
   Elles ne sont plus écrites ici mais dans donnees/gascourt.json, que
   assembler.js insère à cet endroit. Deux raisons de les avoir sorties du
   programme : plusieurs personnes ne peuvent pas modifier des données gravées
   dans le code, chacune en aurait sa copie ; et publier le programme
   publierait les consommations des locataires, qui sont des données
   personnelles. L'assemblage sans données produit la même page, vide.

   Les identifiants des logements sont ceux de l'ancienne page eau, pour que la
   reprise de ses données se fasse sans table de correspondance. */
const AMORCE = /*__DONNEES__*/{"logements":[],"compteurs":[],"releves":[],"factures":[],"parts":{"eau":{},"elec":{}}}/*__FIN__*/;

/* Les parts de l'abonnement sont des accords, non des règles : elles vivent

  version: 1,

  releves:   copie(AMORCE.releves),
  factures:  copie(AMORCE.factures),

function charger(){
  try{
    const b = JSON.parse(localStorage.getItem(KEY));
    if(b && Array.isArray(b.logements) && b.logements.length){
      b.compteurs = b.compteurs && b.compteurs.length ? b.compteurs
                  : copie(AMORCE.compteurs);
      b.releves   = b.releves   || [];
      b.factures  = b.factures  || [];
      b.parts     = b.parts     || JSON.parse(JSON.stringify(DEFAULT_STATE.parts));
      b.signalements = b.signalements || [];
      b.supprimes    = b.supprimes    || [];
      b.calcul = b.calcul || {};
      b.calcul.eau  = b.calcul.eau  || {debut:'', fin:''};
      b.calcul.elec = b.calcul.elec || {debut:'', fin:''};
      b.releves.sort((a,c)=> a.date < c.date ? -1 : 1);
      b.factures.sort((a,c)=> (a.date||'') < (c.date||'') ? -1 : 1);
      return b;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
const maintenant = () => new Date().toISOString();
/* Chaque enregistrement porte sa date de dernière modification, et toute
   suppression laisse une trace datée. Sans ça, fusionner deux fichiers venus
   de deux ordinateurs ferait réapparaître ce que l'un des deux a effacé. */
function marquer(o){ o.maj = maintenant(); return o; }
function enterrer(type, id){
  S.supprimes = (S.supprimes || []).filter(x=> !(x.type===type && x.id===id));
  S.supprimes.push({type, id, maj:maintenant()});
}
/* L'écriture locale est immédiate et sûre ; l'envoi vers le dépôt partagé est
   différé, parce qu'une saisie va par rafales et que chaque envoi est un commit.
   sauver(true) écrit sans rien envoyer : c'est ce qu'emploie la fusion, qui
   déclencherait sinon un envoi au milieu de son propre aller-retour. */
function sauver(sansEnvoi){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ alert(t('errQuota')); }        // quota dépassé : on prévient au lieu de perdre en silence
  if(!sansEnvoi && typeof programmerPoussee === 'function') programmerPoussee();
}

/* Fusion de deux états : pour chaque enregistrement on garde la version la plus
   récente, et une suppression postérieure l'emporte sur une modification. */
function fusionner(local, entrant){
  const rap = {ajoutes:0, majs:0, ignores:0};
  const tombes = {};
  [...(local.supprimes||[]), ...(entrant.supprimes||[])].forEach(x=>{
    const k = x.type+':'+x.id;
    if(!tombes[k] || tombes[k] < x.maj) tombes[k] = x.maj;
  });
  const sortie = JSON.parse(JSON.stringify(local));
  sortie.supprimes = Object.entries(tombes).map(([k,maj])=>{
    const i = k.indexOf(':');
    return {type:k.slice(0,i), id:k.slice(i+1), maj};
  });
  for(const nom of ['releves','factures','signalements','compteurs']){
    const par = {};
    (local[nom]||[]).forEach(o=> par[o.id] = o);
    (entrant[nom]||[]).forEach(o=>{
      const a = par[o.id];
      if(!a){ par[o.id] = o; rap.ajoutes++; }
      else if((o.maj||'') > (a.maj||'')){ par[o.id] = o; rap.majs++; }
      else rap.ignores++;
    });
    sortie[nom] = Object.values(par).filter(o=>{
      const x = tombes[nom+':'+o.id];
      return !(x && x > (o.maj||''));
    });
  }
  sortie.releves.sort((a,b)=> a.date<b.date?-1:1);
  sortie.factures.sort((a,b)=> (a.date||'')<(b.date||'')?-1:1);
  (entrant.logements||[]).forEach(le=>{
    const ll = sortie.logements.find(x=>x.id===le.id);
    if(ll && (le.maj||'') > (ll.maj||'')) Object.assign(ll, le);
    else if(!ll) sortie.logements.push(le);
  });
  return {etat:sortie, rap};
}

/* Reprise de l'ancienne page eau : ses relevés portaient un index par logement
   sans notion de cadran, ses factures ne portaient pas de fluide. On convertit
   sans jamais écrire dans son stock à elle. */
function convertirAncienneEau(b){
  const rel = (b.releves||[]).map(r=>{
    const index = {};
    for(const k in (r.index||{})) index['eau:'+k] = {u:r.index[k]};
    return {id:r.id, fluide:'eau', date:r.date, index, maj:r.maj};
  });
  const fac = (b.factures||[]).map(f=> Object.assign({}, f, {fluide:'eau'}));
  const logs = (b.logements||[]).map(l=>({id:l.id, nom:l.nom, surface:l.surface, maj:l.maj}));
  const cpts = (b.logements||[]).map(l=>({id:'eau:'+l.id, fluide:'eau', logement:l.id,
    nom:l.nom, inclut: l.inclut ? 'eau:'+l.inclut : null, maj:l.maj}));
  return {logements:logs, compteurs:cpts, releves:rel, factures:fac,
          signalements:(b.signalements||[]).map(g=>Object.assign({fluide:'eau'},g)),
          supprimes:b.supprimes||[]};
}

/* Un PDF est conservé en base64 dans l'état ; il faut le repasser en blob pour l'afficher. */
function blobPdf(d){
  const [entete, b64] = String(d).split(',');
  const type = (entete.match(/:(.*?);/) || [])[1] || 'application/pdf';
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], {type});
}

/* index d'un compteur pour un cadran, absent vaut « non relevé » et non zéro */
const idx = (r, cpt, cad) => {
  const o = r && r.index && r.index[cpt];
  return o && o[cad] != null ? o[cad] : null;
};
/* Le compteur général est facultatif côté électricité : Victoria ne l'a jamais
   relevé. Sans lui, le total facturé est la somme des sous-compteurs et il n'y
   a pas d'écart à répartir. */
function generalReleve(A, B, f=FL){
  const g = generalDe(f);
  if(!g) return false;
  return cadrans(f).every(c=> idx(A,g.id,c) != null && idx(B,g.id,c) != null);
}

/* Répartit un total au centime près : la somme des parts arrondies redonne
   exactement le total, les centimes restants vont aux plus fortes décimales. */
function arrondirSomme(vals, d=2){
  const f=Math.pow(10,d), brut=vals.map(v=>v*f), bas=brut.map(Math.floor);
  let reste = Math.round(brut.reduce((a,b)=>a+b,0)) - bas.reduce((a,b)=>a+b,0);
  const ordre = brut.map((v,i)=>({i,r:v-bas[i]})).sort((a,b)=>b.r-a.r);
  for(let k=0;k<reste&&k<ordre.length;k++) bas[ordre[k].i]++;
  return bas.map(v=>v/f);
}

/* ── ce que dit une facture ──────────────────────────── */
/* Tout le calcul se mène en TTC, et une seule fois. Le hors taxes n'est pas
   une autre grandeur, c'est le TTC divisé par un plus le taux : comme toutes
   les composantes d'une même facture portent le même taux, la division est
   exacte et le décompte imprimé peut afficher les deux sans jamais diverger. */
const tauxTva = f => (f && f.tva != null) ? f.tva : (f && f.fluide === 'elec' ? 20 : 7.63);

/* Prix TTC de l'unité pour un cadran, hors abonnement et hors accise.
   Pour l'eau, par ordre de fiabilité : le prix au litre imprimé sur la facture,
   sinon le montant total moins l'abonnement divisé par le volume, sinon le prix
   saisi à la main, sinon le prix hors taxes majoré. */
function prixDe(f, cad){
  if(!f) return 0;
  if(f.fluide === 'elec'){
    const p = f.pu && f.pu[cad];
    return p > 0 ? p * (1 + tauxTva(f)/100) : 0;
  }
  if(f.litre > 0) return f.litre*1000;
  if(f.volume > 0 && f.montant > 0) return Math.max(0, f.montant - (f.fixe||0))/f.volume;
  if(f.prix > 0) return f.prix;
  if(f.ht > 0)   return f.ht * (1 + tauxTva(f)/100);
  return 0;
}
function sourcePrix(f){
  if(!f) return '';
  // côté électricité le prix affiché est celui de la facture, sans conversion
  if(f.fluide === 'elec') return t('sourceM3');
  if(f.litre > 0) return t('sourceLitre');
  if(f.volume > 0 && f.montant > 0) return t('sourceTotal');
  if(f.prix > 0) return t('sourceM3');
  return f.ht > 0 ? t('sourceHT',{x:nf(tauxTva(f),2)}) : '';
}
/* Accise TTC par unité. L'eau n'en a pas : sa taxe est déjà dans le prix au litre. */
const acciseDe = f => (f && f.fluide === 'elec' && f.accise > 0)
  ? f.accise * (1 + tauxTva(f)/100) : 0;
/* Parts fixes TTC de la facture : abonnement, et pour l'électricité la CTA. */
function fixeDe(f){
  if(!f) return 0;
  if(f.fluide === 'elec') return ((f.abo||0) + (f.cta||0)) * (1 + tauxTva(f)/100);
  return f.fixe || 0;
}
/* Durée réellement couverte par l'abonnement. L'eau facture des semestres
   d'avance, sans rapport avec la période de consommation : la facture de
   février 2026 porte deux semestres sur 323 jours de consommation. L'électricité
   facture l'abonnement de la période elle-même. */
function joursAbo(f){
  if(!f) return 1;
  if(f.fluide === 'elec') return (f.debut && f.fin && jours(f.debut,f.fin)) || 61;
  return (f.semestres || 2) * 182.5;
}
const tauxAbo = f => (!f || f.fixeMode === 'aucune') ? 0 : fixeDe(f) / joursAbo(f);
const modeFixe = f => (f && f.fixeMode) || 'egales';

/* ── prix tels qu'ils sont écrits sur la facture ─────── */
/* Le moteur travaille en TTC de bout en bout, mais EDF imprime des prix hors
   taxes : afficher 0,12084 € là où la facture dit 0,1007 € rend le décompte
   invérifiable par le locataire. Côté électricité on affiche donc le hors
   taxes, et la TVA prend sa propre ligne, comme sur la facture. L'eau, elle,
   se saisit et s'affiche en TTC. */
const enHT      = fl => fl === 'elec';
const mention   = fl => t(enHT(fl) ? 'uHT' : 'uTTC');
const prixAff   = (f, cad) => enHT(f.fluide) ? ((f.pu && f.pu[cad]) || 0) : prixDe(f, cad);
const acciseAff = f => enHT(f.fluide) ? (f.accise || 0) : acciseDe(f);
const fixeAff   = f => enHT(f.fluide) ? ((f.abo||0) + (f.cta||0)) : fixeDe(f);
const versAff   = (r, v) => enHT(r.fluide) ? v/(1 + r.TP.tva/100) : v;

/* Décomposition affichable d'un logement, exprimée dans la même base que la
   facture. La somme des composantes redonne exactement le total à régler :
   l'énergie absorbe le centime d'arrondi, sinon le locataire additionne la
   colonne et ne retombe pas sur le total. */
function pieces(r, l){
  const ht = enHT(r.fluide);
  const k  = ht ? 1/(1 + r.TP.tva/100) : 1;
  const sousTotal = Math.round(l.montant*k*100)/100;
  const pf  = Math.round(l.partFixe*k*100)/100;
  const acc = Math.round(l.accise*k*100)/100;
  const ene = Math.round((sousTotal - pf - acc)*100)/100;
  return {ht, ene, acc, pf, sousTotal, tva: l.montant - sousTotal, total: l.montant};
}

/* Recouvrement en jours entre deux intervalles de dates ISO. */
function recouvre(a,b,c,d){
  const deb = a > c ? a : c, fin = b < d ? b : d;
  return fin > deb ? jours(deb,fin) : 0;
}

/* ── tarif d'une période relevée ─────────────────────── */
/* Moyenne des prix pondérée par le nombre de jours que chaque facture recouvre,
   et abonnement au prorata des jours retenus. Sans cela une période à cheval
   sur deux factures se voit appliquer le prix de l'une seulement, et
   l'abonnement entier d'une facture même sur quinze jours. */
/* Chaque facture confie ses parts fixes à une seule période de relevé, celle
   qu'elle recouvre le plus. L'abonnement se lit alors sur le décompte tel qu'il
   est imprimé sur la facture, et il n'est ni compté deux fois ni oublié quand
   les dates de relevé et de facturation ne coïncident pas. */
function porteurDesPartsFixes(fl){
  const per = periodesMesurees(fl), out = {};
  for(const f of facturesDe(fl)){
    if(!f.debut || !f.fin) continue;
    let meilleure = null, large = 0;
    for(const p of per){
      const n = recouvre(p.A.date, p.B.date, f.debut, f.fin);
      if(n > large){ large = n; meilleure = p; }
    }
    if(meilleure) out[f.id] = meilleure.A.id + '_' + meilleure.B.id;
  }
  return out;
}

function tarifPeriode(fl, A, B){
  const d = jours(A.date, B.date);
  const fs = facturesDe(fl);
  if(!fs.length || d <= 0) return null;
  const cads = cadrans(fl);
  const entier = FLUIDES[fl].fixeEntier;
  const porteur = entier ? porteurDesPartsFixes(fl) : null;
  const ici = A.id + '_' + B.id;
  const cumul = {}; cads.forEach(c=> cumul[c] = 0);
  let cumulAccise = 0, couv = 0, abo = 0;
  const parts = [];
  for(const f of fs){
    if(!f.debut || !f.fin) continue;
    const n = recouvre(A.date, B.date, f.debut, f.fin);
    if(n <= 0) continue;
    const q = entier
      ? (f.fixeMode === 'aucune' || porteur[f.id] !== ici ? 0 : fixeDe(f))
      : tauxAbo(f) * n;
    cads.forEach(c=> cumul[c] += prixDe(f,c)*n);
    cumulAccise += acciseDe(f)*n;
    couv += n; abo += q;
    parts.push({f, n, part:n/d, abo:q});
  }
  if(!parts.length){                      // aucune facture datée ne recouvre : la plus récente
    const f = fs[fs.length-1];
    const pu = {}; cads.forEach(c=> pu[c] = prixDe(f,c));
    return {pu, accise:acciseDe(f), abo: f.fixeMode==='aucune' ? 0 : fixeDe(f),
            parts:[], F:f, hors:d, tva:tauxTva(f)};
  }
  const ref = parts[parts.length-1];
  let aboHors = 0;
  if(couv < d){                                // jours hors facture : dernier tarif connu
    cads.forEach(c=> cumul[c] += prixDe(ref.f,c)*(d-couv));
    cumulAccise += acciseDe(ref.f)*(d-couv);
    // les parts fixes attribuées en entier ne se prolongent pas : la facture qui
    // couvrira ces jours apportera les siennes, sur sa propre période
    aboHors = entier ? 0 : tauxAbo(ref.f)*(d-couv);
    abo += aboHors;
  }
  const pu = {}; cads.forEach(c=> pu[c] = cumul[c]/d);
  return {pu, accise:cumulAccise/d, abo, aboHors, entier,
          parts, F:ref.f, hors:d-couv, tva:tauxTva(ref.f)};
}

/* ── calcul d'une période ────────────────────────────── */
function calculer(fl, idA, idB){
  const R = relevesDe(fl);
  const A = R.find(r=>r.id===idA), B = R.find(r=>r.id===idB);
  if(!A || !B) return {erreur:t('errDeuxReleves')};
  if(A.id === B.id)   return {erreur:t('errMemeReleve')};
  if(A.date > B.date) return {erreur:t('errOrdre')};
  const TP = tarifPeriode(fl, A, B);
  if(!TP || !TP.F) return {erreur:t('errFacture')};
  const F = TP.F, cads = cadrans(fl);

  // consommation brute de chaque compteur, cadran par cadran
  const brut = {};
  for(const c of compteursDe(fl)){
    brut[c.id] = {};
    for(const cad of cads){
      const a = idx(A,c.id,cad), b = idx(B,c.id,cad);
      brut[c.id][cad] = (a==null || b==null) ? null : b - a;
      if(brut[c.id][cad] != null && brut[c.id][cad] < 0)
        return {erreur:t('errRecul',{x:nomDe(c.id)})};
    }
  }
  const hasGen = generalReleve(A, B, fl);
  const G = generalDe(fl);

  const zero = () => { const o={}; cads.forEach(c=>o[c]=0); return o; };
  const lignes = logementsDe().map(l=>{
    const cpts = compteursDu(l.id, fl).map(c=>{
      const delta = zero(), ded = zero(), net = zero();
      cads.forEach(cad=>{
        delta[cad] = brut[c.id] && brut[c.id][cad] != null ? brut[c.id][cad] : 0;
        ded[cad]   = c.inclut && brut[c.inclut] && brut[c.inclut][cad] != null ? brut[c.inclut][cad] : 0;
        net[cad]   = delta[cad] - ded[cad];
      });
      return {id:c.id, nom:c.nom, inclut:c.inclut, delta, ded, net};
    });
    const propre = zero();
    cpts.forEach(c=> cads.forEach(cad=> propre[cad] += c.net[cad]));
    return {id:l.id, nom:l.nom, surface:l.surface||0, cpts, propre,
            brut:  cpts.reduce((s,c)=>{ cads.forEach(cad=> s[cad]+=c.delta[cad]); return s; }, zero()),
            deduction: cpts.reduce((s,c)=>{ cads.forEach(cad=> s[cad]+=c.ded[cad]); return s; }, zero())};
  });
  for(const li of lignes)
    for(const cad of cads)
      if(li.propre[cad] < -0.0005){
        const c = li.cpts.find(x=>x.inclut);
        return {erreur:t('errInclut',{a:esc(li.nom), b:esc(nomDe(c ? c.inclut : ''))})};
      }

  const somme = zero();
  lignes.forEach(l=> cads.forEach(cad=> somme[cad] += l.propre[cad]));
  const general = zero(), ecart = zero();
  cads.forEach(cad=>{
    general[cad] = hasGen ? brut[G.id][cad] : somme[cad];
    ecart[cad]   = general[cad] - somme[cad];
  });

  // l'écart se répartit cadran par cadran : mélanger des heures creuses et des
  // heures pleines reviendrait à facturer les unes au prix des autres
  lignes.forEach(l=>{
    l.part = zero(); l.facture = zero();
    cads.forEach(cad=>{
      l.part[cad] = somme[cad] > 0 ? ecart[cad]*l.propre[cad]/somme[cad] : ecart[cad]/lignes.length;
      l.facture[cad] = l.propre[cad] + l.part[cad];
    });
    l.totalPropre  = cads.reduce((s,c)=> s+l.propre[c], 0);
    l.totalFacture = cads.reduce((s,c)=> s+l.facture[c], 0);
  });
  const sommeTot   = cads.reduce((s,c)=> s+somme[c], 0);
  const generalTot = cads.reduce((s,c)=> s+general[c], 0);
  const ecartTot   = generalTot - sommeTot;
  const pct = sommeTot > 0 ? ecartTot/sommeTot*100 : 0;

  const alertes = [];
  /* Une période sans facture n'est pas une erreur, mais le prix appliqué est
     alors une extrapolation. Le dire ici et non seulement dans le détail replié :
     personne ne déplie un tableau dont il ignore qu'il contient un avertissement. */
  if(!TP.parts.length) alertes.push({t:'warn', m:t('aucuneFacture',{f:esc(F.libelle)})});
  else if(TP.hors > 0) alertes.push({t:'info', m:t('joursHorsAlerte',{n:TP.hors, f:esc(F.libelle)})});
  if(hasGen){
    if(ecartTot < 0 && pct <= -3) alertes.push({t:'warn', m:t('alerteEcartNeg')});
    else if(pct > 30)             alertes.push({t:'warn', m:t('alerteEcartPos')});
  }else alertes.push({t:'info', m:t('sansGeneral')});

  // parts fixes : abonnement, et CTA côté électricité
  const mode = modeFixe(F), fixe = TP.abo;
  const surfTot = lignes.reduce((s,l)=>s+l.surface,0);
  const partsM  = (S.parts && S.parts[fl]) || {};
  const partManuelle = l => (partsM[l.id] || 0)/100;
  lignes.forEach(l=>{
    l.cleFixe = mode === 'egales'  ? 1/lignes.length
              : mode === 'surface' ? (surfTot>0 ? l.surface/surfTot : 1/lignes.length)
              : mode === 'prorata' ? (sommeTot+ecartTot>0 ? l.totalFacture/(sommeTot+ecartTot) : 1/lignes.length)
              : mode === 'manuel'  ? partManuelle(l)
              : 0;
    l.partFixe = fixe * l.cleFixe;
    l.energie  = cads.reduce((s,cad)=> s + l.facture[cad]*TP.pu[cad], 0);
    l.accise   = l.totalFacture * TP.accise;
  });
  const montants = arrondirSomme(lignes.map(l=> l.energie + l.accise + l.partFixe));
  lignes.forEach((l,i)=>{
    l.montant = montants[i];
    l.montantHT = l.montant / (1 + TP.tva/100);
    l.montantTva = l.montant - l.montantHT;
  });

  const cleTotale = lignes.reduce((s,l)=>s+l.cleFixe,0);
  return {fluide:fl, A, B, F, TP, lignes, cads, hasGen,
          general, somme, ecart, generalTot, sommeTot, ecartTot, pct,
          fixe, mode, surfTot, cleTotale, alertes,
          nbJours: jours(A.date,B.date),
          totalRefacture: montants.reduce((a,b)=>a+b,0)};
}

/* Toutes les périodes entre deux relevés consécutifs. Celles dont les chiffres
   ne tiennent pas debout sont conservées et marquées, jamais escamotées : une
   période qui disparaît sans explication passe pour un bug. */
function periodesMesurees(fl=FL){
  const out = [], tri = relevesDe(fl), cads = cadrans(fl);
  for(let i=1;i<tri.length;i++){
    const A = tri[i-1], B = tri[i], d = jours(A.date, B.date);
    let valide = d > 0;
    const brut = {};
    for(const c of compteursDe(fl)){
      brut[c.id] = {};
      for(const cad of cads){
        const a = idx(A,c.id,cad), b = idx(B,c.id,cad);
        brut[c.id][cad] = (a==null || b==null) ? null : b - a;
        if(brut[c.id][cad] != null && brut[c.id][cad] < 0) valide = false;
      }
    }
    if(!valide){ out.push({A, B, d, valide:false}); continue; }
    let somme = 0;
    for(const l of logementsDe())
      for(const c of compteursDu(l.id, fl))
        for(const cad of cads){
          const v = brut[c.id][cad] || 0;
          const w = c.inclut ? (brut[c.inclut] ? (brut[c.inclut][cad] || 0) : 0) : 0;
          somme += v - w;
        }
    if(somme < 0){ out.push({A, B, d, valide:false}); continue; }
    const G = generalDe(fl);
    const hasGen = generalReleve(A, B, fl);
    const general = hasGen ? cads.reduce((s,cad)=> s + (brut[G.id][cad]||0), 0) : somme;
    out.push({A, B, d, valide:true, hasGen, general, somme, ecart: general - somme});
  }
  return out;
}

/* ── contrôle de cohérence des relevés ───────────────── */
/* Parcourt les couples consécutifs et signale ce qui ne tient pas debout.
   Chaque anomalie est rattachée aux deux relevés du couple, pour pouvoir
   marquer les lignes fautives et filtrer sur un relevé en cours de saisie. */
const MINJ = 90;   // en deçà, annualiser une période ne veut rien dire
function anomaliesDe(R, fl=FL){
  const out = [], cads = cadrans(fl), cpts = compteursDe(fl), G = generalDe(fl);
  const tri = R.filter(r=>r.fluide===fl).sort((a,b)=> a.date < b.date ? -1 : 1);
  const aujourdhui = new Date().toISOString().slice(0,10);
  const q = v => qte(v, fl);

  for(const r of tri)
    if(r.date > aujourdhui) out.push({t:'warn', rels:[r.id], m:t('ctrlFutur',{x:dateFr(r.date)})});

  for(let i=1;i<tri.length;i++){
    const A = tri[i-1], B = tri[i], rels = [A.id, B.id], d = jours(A.date, B.date);
    if(d <= 0){ out.push({t:'err', rels, m:t('ctrlDates',{x:dateFr(B.date)})}); continue; }

    // un compteur ne revient pas en arrière
    let recul = false;
    const inc = {};
    for(const c of cpts){
      inc[c.id] = {};
      for(const cad of cads){
        const a = idx(A,c.id,cad), b = idx(B,c.id,cad);
        /* Un sous-compteur sans index est compté pour zéro par le calcul, ce
           qui passerait inaperçu : le cas arrive dès qu'on ajoute un compteur
           après des relevés déjà saisis. Le général, lui, est facultatif. */
        if((a == null || b == null) && c.logement){
          inc[c.id][cad] = null;
          if(cad === cads[0])
            out.push({t:'warn', rels, m:t('ctrlIndexAbsent',{x:esc(c.nom),
                      da:dateFr(A.date), db:dateFr(B.date)})});
          continue;
        }
        if(a == null || b == null){ inc[c.id][cad] = null; continue; }
        inc[c.id][cad] = b - a;
        if(b < a){
          recul = true;
          const nom = esc(c.nom) + (cads.length > 1 ? ', ' + nomCadranCourt(cad) : '');
          out.push({t:'err', rels, m:t('ctrlRecul',{x:nom, a:nf(a,FLUIDES[fl].dec), da:dateFr(A.date),
                                                    b:nf(b,FLUIDES[fl].dec), db:dateFr(B.date)})});
        }
      }
    }
    if(recul) continue;

    // un compteur englobant mesure forcément plus que celui qu'il englobe
    let englobe = false;
    for(const c of cpts) if(c.inclut){
      let mien = 0, sien = 0, connu = true;
      for(const cad of cads){
        if(inc[c.id][cad] == null || !inc[c.inclut] || inc[c.inclut][cad] == null){ connu = false; break; }
        mien += inc[c.id][cad]; sien += inc[c.inclut][cad];
      }
      if(connu && mien < sien){
        englobe = true;
        out.push({t:'err', rels, m:t('ctrlInclut',{a:esc(c.nom), b:esc(nomDe(c.inclut)),
                  x:q(mien), y:q(sien), da:dateFr(A.date), db:dateFr(B.date)})});
      }
    }
    if(englobe) continue;

    // somme des logements comparée au compteur général, quand il est relevé
    let somme = 0;
    for(const c of cpts) if(c.logement)
      for(const cad of cads)
        somme += (inc[c.id][cad] || 0) - (c.inclut && inc[c.inclut] ? (inc[c.inclut][cad] || 0) : 0);
    const gen = (G && generalReleve(A,B,fl))
      ? cads.reduce((s,cad)=> s + (inc[G.id][cad] || 0), 0) : null;

    if(gen != null && somme > 0){
      if(gen < somme*0.95)
        out.push({t:'warn', rels, m:t('ctrlSousGeneral',{p:nf((somme/gen-1)*100,1),
                  da:dateFr(A.date), db:dateFr(B.date)})});
      if(gen > somme*1.5)
        out.push({t:'warn', rels, m:t('ctrlSurGeneral',{p:nf((gen/somme-1)*100,0),
                  da:dateFr(A.date), db:dateFr(B.date)})});
    }

    // Rythme annuel comparé à la médiane des autres périodes. Ramener à l'année
    // une poignée de jours ne veut rien dire, une absence ou un chauffage d'appoint
    // suffit à doubler le résultat : sous un trimestre, on ne compare pas. Les
    // périodes trop courtes ne servent pas non plus de référence.
    if(d >= MINJ){
      const totalDe = (X,Y)=>{
        let s = 0, ok = true;
        const src = (G && generalReleve(X,Y,fl)) ? [G] : cpts.filter(c=>c.logement);
        for(const c of src) for(const cad of cads){
          const a = idx(X,c.id,cad), b = idx(Y,c.id,cad);
          if(a == null || b == null){ ok = false; break; }
          s += b - a - (c.inclut ? Math.max(0,(idx(Y,c.inclut,cad)||0)-(idx(X,c.inclut,cad)||0)) : 0);
        }
        return ok ? s : null;
      };
      const refs = [];
      for(let k=1;k<tri.length;k++){
        if(k===i) continue;
        const dd = jours(tri[k-1].date, tri[k].date);
        const v = totalDe(tri[k-1], tri[k]);
        if(dd >= MINJ && v != null && v >= 0) refs.push(v*365/dd);
      }
      const ici = totalDe(A,B);
      if(refs.length && ici != null){
        refs.sort((a,b)=>a-b);
        const n2 = refs.length;
        const med = n2%2 ? refs[(n2-1)/2] : (refs[n2/2-1] + refs[n2/2])/2;
        const rythme = ici*365/d;
        if(med > 0 && (rythme > med*3 || rythme < med/3))
          out.push({t:'warn', rels, m:t('ctrlRythme',{x:q(rythme), y:q(med),
                    da:dateFr(A.date), db:dateFr(B.date)})});
      }
    }
  }
  return out;
}

/* ── vue 1 : répartition ─────────────────────────────── */
let detailTarif = false;

/* Signe explicite : « + 12 » et « − 12 » se lisent, « -12 » se rate. */
const signe = (v, f=FL) => (v < 0 ? '− ' : '+ ') + qte(Math.abs(v), f);

/* Bloc des index d'un logement. Avec un seul compteur et un seul cadran on
   garde les deux grandes cases de la page eau ; dès qu'il y a deux cadrans ou
   deux compteurs, on passe à une ligne par cadran, sinon la carte devient
   illisible. */
function blocCompteurs(l, r){
  const fl = r.fluide, cads = r.cads, dec = FLUIDES[fl].dec;
  if(l.cpts.length === 1 && cads.length === 1){
    const c = l.cpts[0];
    return `<div class="idx">
      <div><div class="lab">${dateFr(r.A.date)}</div>
        <div class="v num">${nf(idx(r.A,c.id,'u'), dec)}</div></div>
      <div><div class="lab">${dateFr(r.B.date)}</div>
        <div class="v num">${nf(idx(r.B,c.id,'u'), dec)}</div></div>
    </div>`;
  }
  /* Plusieurs compteurs sur un même logement se suivent dans le même encadré,
     sans sous-titre : leurs index sont d'ordres de grandeur si différents que
     nommer chaque compteur n'apprend rien et double la hauteur de la carte. */
  return `<div class="souscpt">${l.cpts.map(c=>
    cads.map(x=>`<div class="kv">
        <span class="cad">${cads.length>1?`<i class="${x}"></i>`:''}${nomCadranCourt(x)}</span>
        <b class="num" style="font-weight:500;color:var(--ink-3);font-size:12.5px">
          ${nf(idx(r.A,c.id,x), dec)} → ${nf(idx(r.B,c.id,x), dec)}
          &nbsp;<span style="color:var(--ink);font-weight:700">${nf(c.delta[x], dec)}</span></b>
      </div>`).join('')
  ).join('')}</div>`;
}

/* Détail du tarif, une colonne de prix par cadran.

   Une seule facture fournit la période : sa ligne dit déjà tout. La ligne des
   jours non couverts recopierait ses prix, et la moyenne pondérée d'une seule
   ligne est cette ligne. Les deux sont donc tues, et les jours non couverts
   restent signalés par le message affiché sous les cartes. Dès que deux factures
   se partagent la période, tout revient : c'est là que la pondération se voit. */
function lignesTarif(r, cellules){
  const cads = r.cads, fl = r.fluide, dp = FLUIDES[fl].decPrix;
  const seule = r.TP.parts.length <= 1;
  const {td, tr} = cellules;
  const prix = f => cads.map(c=> td(nf(prixAff(f,c),dp) + ' €')).join('')
                  + (r.TP.accise > 0 ? td(nf(acciseAff(f),dp) + ' €') : '');
  // les jours couverts s'écrivent sur le total de la période : une proportion
  // sans son dénominateur ne dit pas de quoi elle est la part
  const couverture = n => td(t('joursSur',{a:n, b:r.nbJours}));
  const out = r.TP.parts.map(x=> tr('',
      `<td>${esc(x.f.libelle)}</td>` + td(dateFr(x.f.debut) + ' → ' + dateFr(x.f.fin))
    + prix(x.f) + couverture(x.n) + td(eur(versAff(r, x.abo)))));
  if(!r.TP.parts.length)                       // aucune facture ne recouvre la période
    out.push(tr('sec', `<td>${t('joursHors')}</td>` + td('—') + prix(r.TP.F)
      + td(r.nbJours + ' ' + t('jours')) + td(eur(versAff(r, r.fixe)))));
  else if(r.TP.hors > 0 && !seule)
    out.push(tr('sec', `<td>${t('joursHors')}</td>` + td('—') + prix(r.TP.F)
      + couverture(r.TP.hors)
      + td(r.TP.aboHors ? eur(versAff(r, r.TP.aboHors)) : '—')));
  if(!seule)
    out.push(tr('tot', `<td>${t('prixMoyen')}</td><td></td>`
      + cads.map(c=> td(nf(versAff(r, r.TP.pu[c]),dp) + ' €')).join('')
      + (r.TP.accise > 0 ? td(nf(versAff(r, r.TP.accise),dp) + ' €') : '')
      + td(r.nbJours + ' ' + t('jours')) + td(eur(versAff(r, r.fixe)))));
  return out.join('');
}
function enTeteTarif(r){
  const cads = r.cads, fl = r.fluide;
  // la mention reste collée au dernier mot : « HT » seul sur sa ligne se lit mal
  const mt = '&nbsp;<span class="mt">' + mention(fl) + '</span>';
  return `<tr><th>${t('facture')}</th><th>${t('periode')}</th>
    ${cads.map(c=>`<th>${cads.length>1 ? nomCadran(c)+mt
      : t(fl==='eau'?'prixUnitEau':'prixUnitElec')}</th>`).join('')}
    ${r.TP.accise > 0 ? `<th>${t('accise')}${mt}</th>` : ''}
    <th>${t('partPeriode')}</th>
    <th>${fl === 'elec' ? t('aboCta') : t('abonnement')}${mt}</th></tr>`;
}
function tableTarif(r){
  const cellules = {
    td: v => `<td class="num">${v}</td>`,
    tr: (cl, contenu) => `<tr${cl?` class="${cl}"`:''}>${contenu}</tr>`
  };
  return `<div class="scroll" style="margin-bottom:16px"><table>
    <thead>${enTeteTarif(r)}</thead>
    <tbody>${lignesTarif(r, cellules)}</tbody></table></div>`;
}

function ligneTarif(r){
  const dp = FLUIDES[r.fluide].decPrix, a = eur(versAff(r, r.fixe));
  if(r.fluide === 'eau')
    return t('ligneTarifEau',{j:r.nbJours, p:nf(r.TP.pu.u,dp), a});
  return t('ligneTarifElec',{j:r.nbJours, hc:nf(versAff(r, r.TP.pu.hc),dp),
                             hp:nf(versAff(r, r.TP.pu.hp),dp), a});
}

/* Ce que le fournisseur facture, contre ce que les locataires paient. La
   différence est la première question du propriétaire devant sa facture, et
   elle ne se devine pas : elle tient aux kWh que la facture compte et que les
   sous-compteurs n'ont pas vus, jamais aux parts fixes, réparties en entier. */
function rapprochement(r){
  if(!FLUIDES[r.fluide].suivi) return null;
  const parts = r.TP.parts;
  if(!parts.length || !parts.every(x=> x.f.montant > 0)) return null;
  /* Les deux montants doivent porter sur les mêmes jours. Additionner le total
     d'une facture qui ne recoupe la période que de six jours gonflait le reste
     à charge de plusieurs centaines d'euros : mieux vaut ne rien afficher et
     dire pourquoi. On exige donc une seule facture, recouvrant l'essentiel de
     la période comme la période recouvre l'essentiel de la facture. */
  if(parts.length > 1) return {impossible:'rapprochPlusieurs'};
  const x = parts[0], jFacture = jours(x.f.debut, x.f.fin);
  if(x.n < r.nbJours*0.95 || x.n < jFacture*0.95)
    return {impossible:'rapprochDecale', n:x.n, d:jFacture, p:r.nbJours};
  return {factureTTC:x.f.montant, reparti:r.totalRefacture,
          reste:x.f.montant - r.totalRefacture,
          volFacture:x.f.volume || 0, volMesure:r.sommeTot};
}
function blocRapprochement(r){
  const q = rapprochement(r);
  if(!q) return '';
  if(q.impossible)
    return `<p class="englobe">${t(q.impossible, {n:q.n, d:q.d, p:q.p})}</p>`;
  const fl = r.fluide, dec = FLUIDES[fl].dec;
  const positif = q.reste >= 0;
  const diff = q.volFacture - q.volMesure;
  const expl = !q.volFacture ? t('rapprochSansVolume')
    : t(diff >= 0 ? 'rapprochPlus' : 'rapprochMoins',
        {k: qte(Math.abs(diff), fl, dec), vf: qte(q.volFacture, fl, dec),
         vm: qte(q.volMesure, fl, dec)});
  return `<h4 style="margin-top:22px">${t('rapprochTitre')}</h4>
    <div class="scroll" style="max-width:560px"><table><tbody>
      <tr><td>${t('rapprochFacture')}</td><td class="num">${eur(q.factureTTC)}</td></tr>
      <tr><td>${t('rapprochReparti')}</td><td class="num">${eur(q.reparti)}</td></tr>
      <tr class="tot"><td>${positif ? t('rapprochReste') : t('rapprochEncaisse')}</td>
        <td class="num">${eur(Math.abs(q.reste))}</td></tr>
    </tbody></table></div>
    <p class="englobe">${expl}</p>
    <p class="englobe">${t('rapprochCumul')}</p>`;
}

/* Une carte de logement. Le document imprimé reprend exactement la même : même
   grille, mêmes couleurs, même ordre des lignes. Seuls les champs modifiables
   deviennent du texte et le bouton Avis disparaît. Trois tableaux denses sur du
   papier effraient là où quatre cartes se lisent d'un coup. */
function carteLogement(r, l, i, statique){
  const fl = r.fluide, cads = r.cads;
  const [cv, cb] = TEINTES[i%4];
  const p = pieces(r, l);
  // Le bloc des compteurs montre déjà la consommation de chaque cadran : on ne
  // redonne le détail que là où il apporte un chiffre nouveau, la déduction
  // d'un compteur englobé.
  const aDeduction = cads.some(x=> l.deduction[x] > 0);
  return `<div class="lgt">
    <div class="top" style="background:var(${cb})">
      <div class="ico" style="background:var(${cv})">${ico('maison',15)}</div>
      ${statique ? `<b>${esc(l.nom)}</b>`
                 : `<input class="edit nom" data-nom="${l.id}" value="${esc(l.nom)}">`}
    </div>
    <div class="body">
      ${fl === 'elec'
        ? `<div class="datescarte">${t('duAu',{a:dateFr(r.A.date), b:dateFr(r.B.date)})}</div>`
        : `<div class="kv"><span>${t('surface')}</span>
             <b>${statique ? nf(l.surface,0)
               : `<input class="edit surf num" type="number" step="1" min="0" data-surf="${l.id}"
                    value="${l.surface!=null?l.surface:''}">`} m²</b></div>`}
      ${blocCompteurs(l, r)}
      ${aDeduction ? `<div class="kv"><span>${t('releveCompteur')}</span>
        <b class="num">${qte(cads.reduce((s,x)=>s+l.brut[x],0), fl)}</b></div>
      <div class="kv">
        <span>− ${esc(nomDe((l.cpts.find(x=>x.inclut)||{}).inclut))}</span>
        <b class="num">${qte(cads.reduce((s,x)=>s+l.deduction[x],0), fl)}</b></div>` : ''}
      <div class="kv"><span>${t('consoPropre')}</span>
        <b class="num" style="color:var(${cv})">${qte(l.totalPropre, fl)}</b></div>
      ${r.hasGen ? `<div class="kv"><span>${t('partEcart')}</span>
        <b class="num">${signe(cads.reduce((s,x)=>s+l.part[x],0), fl)}</b></div>
      <div class="kv gras"><span>${t('volumeFacture')}</span>
        <b class="num">${qte(l.totalFacture, fl)}</b></div>` : ''}
      <div class="sep2"></div>
      <div class="kv"><span>${fl==='eau'?t('eau'):t('energie')}</span><b class="num">${eur(p.ene)}</b></div>
      ${p.acc ? `<div class="kv"><span>${t('accise')}</span><b class="num">${eur(p.acc)}</b></div>` : ''}
      <div class="kv"><span>${fl==='elec'?t('aboCta'):t('abonnement')}</span>
        <b class="num">${eur(p.pf)}</b></div>
      ${p.ht ? `<div class="kv gras"><span>${t('totalHT')}</span>
        <b class="num">${eur(p.sousTotal)}</b></div>
      <div class="kv"><span>${t('avisTvaL',{x:nf(r.TP.tva,0)})}</span>
        <b class="num">${eur(p.tva)}</b></div>` : ''}
    </div>
    <div class="foot" style="background:var(${cb})"><div><div class="lab">${t('aRegler')}</div>
      <div class="v num">${eur(p.total)}</div></div></div>
  </div>`;
}
const grilleCartes = (r, statique) =>
  `<div class="quad">${r.lignes.map((l,i)=> carteLogement(r, l, i, statique)).join('')}</div>`;

function vueRepartition(){
  const fl = FL, c = S.calcul[fl];
  const toutes = periodesMesurees(fl);
  const connue = toutes.some(p=> p.A.id===c.debut && p.B.id===c.fin);
  if(!connue && toutes.length){
    const p = [...toutes].reverse().find(x=>x.valide) || toutes[toutes.length-1];
    c.debut = p.A.id; c.fin = p.B.id;
  }
  const r = toutes.length ? calculer(fl, c.debut, c.fin) : {erreur:t('errDeuxReleves')};
  if(r.erreur){
    $('#vue-repartition').innerHTML = `<div class="block">
      <div class="bhead"><div class="badge">${ico('immeuble',28)}</div><div>
        <h2>${t('lesLogements')}</h2></div></div>
      <div class="msg err">${r.erreur}</div></div>`;
    return;
  }
  const cads = r.cads;
  const courant = toutes.findIndex(p=> p.A.id===c.debut && p.B.id===c.fin);

  let html = `<div class="block">
    <div class="bhead"><div class="badge">${ico('immeuble',28)}</div><div>
      <h2>${t('lesLogements')}</h2></div>
      <label class="perio" for="s-per">
        <span class="ic">${ico('calendrier',19)}</span>
        <span class="lb">${t('periodeReleve')}</span>
        <select id="s-per">${toutes.map((p,k)=>
          `<option value="${k}" ${k===courant?'selected':''}>${p.valide?'':'⚠ '}${p.d} ${t('jours')} · ${dateFr(p.A.date)} → ${dateFr(p.B.date)}</option>`
        ).join('')}</select></label></div>
    <p class="tarifLigne">${/* le détail ouvert porte déjà tous ces chiffres */
      detailTarif ? `${r.nbJours} ${t('jours')}` : ligneTarif(r)}
      <a href="#" id="t-detail">${detailTarif ? t('masquerTarif') : t('voirTarif')}</a></p>
    ${detailTarif ? tableTarif(r) : ''}
    ${grilleCartes(r, false)}
    <div class="total"><span>${t('totalARegler')}</span><b class="num">${eur(r.totalRefacture)}</b></div>
    ${blocRapprochement(r)}

    ${r.mode === 'manuel' && Math.abs(r.cleTotale - 1) > 0.0005
      ? `<div class="msg warn" style="margin-top:13px">${t('partsPasCent')}</div>` : ''}
    ${r.alertes.map(a=>`<div class="msg ${a.t}" style="margin-top:13px">${a.m}</div>`).join('')}
    ${r.hasGen ? `<p class="englobe">${t('phraseEcart',{g:qte(r.generalTot,fl), s:qte(r.sommeTot,fl),
      e:qte(Math.abs(r.ecartTot),fl), p:nf(Math.abs(r.pct),1),
      sens:r.ecartTot<0?t('deMoins'):t('dePlus')})}
      ${r.ecartTot<0?t('explEcartNeg'):t('explEcartPos')}</p>` : ''}
    ${(()=>{ const p = r.lignes.find(l=> l.cpts.some(x=>x.inclut));
       if(!p) return '';
       const cc = p.cpts.find(x=>x.inclut);
       return `<p class="englobe">${t('englobe',{a:esc(p.nom), b:esc(nomDe(cc.inclut)),
         v:qte(cads.reduce((s,x)=>s+p.deduction[x],0), fl)})}</p>`; })()}
  </div>`;

  $('#vue-repartition').innerHTML = html;
  habillerSelects($('#vue-repartition'));
  brancherLogements($('#vue-repartition'));
  const td = $('#t-detail');
  if(td) td.onclick = e => { e.preventDefault(); detailTarif = !detailTarif; vueRepartition(); };
  const sp = $('#s-per');
  if(sp) sp.onchange = ()=>{
    const p = toutes[+sp.value]; if(!p) return;
    S.calcul[fl].debut = p.A.id; S.calcul[fl].fin = p.B.id; sauver(); vueRepartition();
  };
}

/* Nom et surface se modifient directement sur les cartes. */
function brancherLogements(racine){
  racine.querySelectorAll('[data-nom]').forEach(i=> i.onchange = ()=>{
    const l = S.logements.find(x=>x.id===i.dataset.nom); if(!l) return;
    marquer(l); l.nom = i.value.trim() || l.nom;
    // le compteur principal du logement porte le même nom, on le suit
    // le nom suit le logement dans les deux fluides : renommer depuis l'onglet
    // eau laissait la saisie électrique afficher l'ancien nom
    for(const f in FLUIDES){
      const cs = compteursDu(l.id, f);
      if(cs.length === 1) cs[0].nom = l.nom;
    }
    sauver(); rafraichir();
  });
  racine.querySelectorAll('[data-surf]').forEach(i=> i.onchange = ()=>{
    const l = S.logements.find(x=>x.id===i.dataset.surf); if(!l) return;
    marquer(l);
    const v = parseFloat(String(i.value).replace(',','.'));
    l.surface = isNaN(v)||v<0 ? 0 : v; sauver(); rafraichir();
  });
}

/* ── documents imprimés ──────────────────────────────── */
/* Construits à part, jamais l'écran plaqué sur du papier. */
const imprimer = html => { $('#impression').innerHTML = html; window.print(); };
const ligne = (a,b,cl='') => `<tr class="${cl}"><td>${a}</td><td class="num">${b}</td></tr>`;
const titreFluide = fl => t(fl === 'eau' ? 'titreEau' : 'titreElec');

function entete(r, sous, sansPeriode){
  const per = t('avisPeriode',{a:dateFr(r.A.date), b:dateFr(r.B.date), j:r.nbJours});
  return `<div class="ent"><h1>${titreFluide(r.fluide)}</h1>
    <p class="meta">${sous}${sansPeriode ? '' : '<br>' + per}
    &nbsp;·&nbsp; ${t('etabliLe',{d:dateFr(new Date().toISOString().slice(0,10))})}</p></div>`
    + (sansPeriode ? `<h2>${per}</h2>` : '');
}

/* Le rapprochement, tel qu'à l'écran mais en composition de document : c'est la
   réponse à la première question qu'on se pose devant le décompte, elle a sa
   place sur le papier qu'on garde. */
function rapprochementImprime(r){
  const q = rapprochement(r);
  if(!q || q.impossible) return '';
  const fl = r.fluide, dec = FLUIDES[fl].dec;
  const diff = q.volFacture - q.volMesure;
  const expl = !q.volFacture ? t('rapprochSansVolume')
    : t(diff >= 0 ? 'rapprochPlus' : 'rapprochMoins',
        {k: qte(Math.abs(diff), fl, dec), vf: qte(q.volFacture, fl, dec),
         vm: qte(q.volMesure, fl, dec)});
  return `<h2>${t('rapprochTitre')}</h2>
    <table><tbody>
      ${ligne(t('rapprochFacture'), eur(q.factureTTC))}
      ${ligne(t('rapprochReparti'), eur(q.reparti))}
      ${ligne('<b>' + (q.reste >= 0 ? t('rapprochReste') : t('rapprochEncaisse')) + '</b>',
              '<b>' + eur(Math.abs(q.reste)) + '</b>', 'tot')}
    </tbody></table>
    <p class="note">${expl}</p>
    <p class="note">${t('rapprochCumul')}</p>`;
}

/* Même tableau qu'à l'écran, avec les mêmes lignes tues quand elles se répètent. */
function blocFacture(r){
  const cellules = {
    td: v => `<td class="num">${v}</td>`,
    tr: (cl, contenu) => `<tr${cl?` class="${cl}"`:''}>${contenu}</tr>`
  };
  return `<h2>${t('tarifPeriode')}</h2>
    <table>
      <thead>${enTeteTarif(r)}</thead>
      <tbody>${lignesTarif(r, cellules)}</tbody>
    </table>`;
}

/* Document du propriétaire. Il reprend la vue Répartition telle quelle : le
   même bandeau de tarif, les mêmes quatre cartes, le même total. Les trois
   grands tableaux d'avant disaient la même chose en plus dense, et un papier
   couvert de colonnes se repousse au lieu de se lire. */
function docPour(r){
  const fl = r.fluide;
  const porteur = r.lignes.find(l=> l.cpts.some(x=>x.inclut));
  const cpt = porteur ? porteur.cpts.find(x=>x.inclut) : null;
  const somme = o => r.cads.reduce((s,c)=> s+o[c], 0);

  return entete(r, t('docSous'), true)
  + blocFacture(r)
  + `<h2>${t('lesLogements')}</h2>`
  + grilleCartes(r, true)
  + `<div class="cadre"><span>${t('totalARegler')}</span><b>${eur(r.totalRefacture)}</b></div>`
  + rapprochementImprime(r)
  + (porteur && cpt ? `<p class="note">${t('englobe',{a:esc(porteur.nom),
      b:esc(nomDe(cpt.inclut)), v:qte(somme(porteur.deduction), fl)})}</p>` : '')
  + (r.hasGen ? `<p class="note">${r.ecartTot<0?t('explEcartNeg'):t('explEcartPos')}</p>`
              : `<p class="note">${t('sansGeneral')}</p>`);
}

   avec detailAvis, piedAvis et avisPour, et les clés du dictionnaire qu'eux
   seuls emploient : avis, avisPourQui, avisDetail, avisIndex, avisIndexCad,
   avisDeduit, avisPart, avisConso, avisAccise, avisAbo et ses variantes,
   avisHT, avisTotal, avisPied, avisPiedSansGen, ctaComprise.
   Le code reste dans l'historique git : node check-code-mort.js le rappelle. */

/* Détail d'un seul logement pour un fluide, sans les chiffres des autres. */
function detailAvis(r, l){
  const fl = r.fluide, cads = r.cads, dec = FLUIDES[fl].dec, dp = FLUIDES[fl].decPrix;
  const p = pieces(r, l);
  const somme = o => cads.reduce((s,c)=> s+o[c], 0);
  const cle = {surface:'avisAboSurface', egales:'avisAboEgales', prorata:'avisAboConso',
               manuel:'avisAboManuel'}[r.mode] || 'avisAbo';
  let out = '';
  for(const c of l.cpts){
    if(l.cpts.length > 1) out += ligne('<b>'+esc(c.nom)+'</b>', '', 'sec');
    for(const cad of cads){
      const lib = cads.length > 1
        ? t('avisIndexCad',{c:nomCadranCourt(cad), d:dateFr(r.A.date)})
        : t('avisIndex',{d:dateFr(r.A.date)});
      const lib2 = cads.length > 1
        ? t('avisIndexCad',{c:nomCadranCourt(cad), d:dateFr(r.B.date)})
        : t('avisIndex',{d:dateFr(r.B.date)});
      out += ligne(lib,  nf(idx(r.A,c.id,cad),dec));
      out += ligne(lib2, nf(idx(r.B,c.id,cad),dec));
      out += ligne(t('releveCompteur') + (cads.length>1 ? ', '+nomCadranCourt(cad) : ''),
                   nf(c.delta[cad],dec));
      if(c.inclut){
        out += ligne(t('avisDeduit',{x:esc(nomDe(c.inclut))}), '− '+nf(c.ded[cad],dec));

let granConso = 'period', partConso = '';

/* Consommation propre de chaque logement entre deux relevés, cadran par cadran.
   Aucun prix n'intervient ici : la courbe doit se tracer même quand aucune
   facture n'a encore été saisie. */
function consoDe(fl, A, B){
  const cads = cadrans(fl), out = {};
  for(const l of logementsDe()){
    const o = {}; cads.forEach(c=> o[c] = 0);
    for(const c of compteursDu(l.id, fl))
      for(const cad of cads){
        const a = idx(A,c.id,cad), b = idx(B,c.id,cad);
        if(a == null || b == null) continue;
        let v = b - a;
        if(c.inclut){
          const x = idx(A,c.inclut,cad), y = idx(B,c.inclut,cad);
          if(x != null && y != null) v -= (y - x);
        }
        o[cad] += v;
      }
    out[l.id] = o;
  }
  return out;
}

/* Une période à cheval sur deux mois est répartie au prorata des jours : sinon
   un relevé pris le 3 du mois ferait basculer deux mois de consommation sur un
   seul, et la courbe mentirait sur la saison. */
function poidsCalendaires(deb, fin, gran){
  const p = s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
  const t0 = p(deb), t1 = p(fin), tot = (t1-t0)/86400000;
  const out = {};
  if(tot <= 0) return out;
  for(let t=t0; t<t1; t+=86400000){
    const d = new Date(t);
    const cle = gran === 'year' ? String(d.getUTCFullYear())
      : d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');
    out[cle] = (out[cle]||0) + 1/tot;
  }
  return out;
}

function libelleSeau(cle, gran){
  if(gran === 'year') return cle;
  const [a,m] = cle.split('-');
  const d = new Date(Date.UTC(+a, +m-1, 1));
  const mois = d.toLocaleDateString(loc(), {month:'short', timeZone:'UTC'});
  return mois.replace('.','') + '\n' + a;
}

function agreger(fl, gran, idLog){
  const per = periodesMesurees(fl).filter(p=>p.valide);
  const cads = cadrans(fl);
  const seaux = [];
  const par = {};
  const ajouter = (cle, ordre, lab, vals, sous)=>{
    let s = par[cle];
    if(!s){ s = par[cle] = {cle, ordre, lab, vals:{}, sous:[]}; cads.forEach(c=> s.vals[c]=0); seaux.push(s); }
    cads.forEach(c=> s.vals[c] += vals[c]);
    if(sous) s.sous.push(sous);
  };
  for(const p of per){
    const c = consoDe(fl, p.A, p.B);
    const vals = {}; cads.forEach(x=> vals[x] = 0);
    for(const l of logementsDe()){
      if(idLog && l.id !== idLog) continue;
      cads.forEach(x=> vals[x] += c[l.id][x]);
    }
    if(gran === 'period'){
      ajouter(p.A.date+'_'+p.B.date, p.A.date,
        dateFr(p.A.date).slice(0,5)+'\n→ '+dateFr(p.B.date).slice(0,5)+'\n'+p.B.date.slice(0,4),
        vals, {deb:p.A.date, fin:p.B.date, j:p.d});
    }else{
      const w = poidsCalendaires(p.A.date, p.B.date, gran);
      for(const cle in w){
        const part = {}; cads.forEach(x=> part[x] = vals[x]*w[cle]);
        ajouter(cle, cle, libelleSeau(cle, gran), part, null);
      }
    }
  }
  seaux.sort((a,b)=> a.ordre < b.ordre ? -1 : 1);
  seaux.forEach(s=> s.total = cads.reduce((a,c)=> a+s.vals[c], 0));
  return seaux;
}

/* Échelle « ronde » : un axe gradué à 1 137 ne se lit pas. */
function palier(v){
  if(v <= 0) return 1;
  const e = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(v <= m*e) return m*e;
  return 10*e;
}

/* ── suivi : ce qui est facturé contre ce qui est mesuré ─────
   Le compteur général n'est pas relevé côté électricité, mais la facture dit
   combien de kWh elle porte. En rapprochant les deux on voit si les
   sous-compteurs suivent, et de combien la facture les dépasse. Une facture qui
   ne coïncide pas avec les dates de relevé reçoit la part des périodes qu'elle
   recouvre, au prorata des jours : c'est une approximation, elle suppose une
   consommation régulière à l'intérieur d'une période. */
function suiviFactures(fl){
  const per = periodesMesurees(fl).filter(p=>p.valide);
  const out = [];
  for(const f of facturesDe(fl)){
    if(!f.debut || !f.fin || !(f.volume > 0)) continue;
    const total = jours(f.debut, f.fin);
    if(total <= 0) continue;
    let mesure = 0, couv = 0, approx = false;
    for(const p of per){
      const n = recouvre(p.A.date, p.B.date, f.debut, f.fin);
      if(n <= 0) continue;
      mesure += p.somme * n / p.d;
      couv += n;
      // une période prise en partie est estimée, même si la facture est
      // entièrement couverte : on suppose alors un rythme régulier sur ses jours
      if(n < p.d) approx = true;
    }
    if(!couv) continue;                       // aucun relevé sur cette facture
    /* Les deux colonnes doivent porter sur la même durée. Sans ça, une facture
       qui commence avant le premier relevé oppose 56 jours de mesure à 62 jours
       de facturation, et l'écart affiché n'est que ce décalage. Le mesuré est
       donc ramené à la durée de la facture, au rythme des jours connus. */
    const ramene = mesure * total / couv;
    if(couv < total - 0.5) approx = true;
    /* En dessous de la moitié des jours, l'extrapolation multiplie la mesure
       par plus de deux : l'écart qui en sortirait ne renseignerait que sur mon
       hypothèse de régularité, pas sur vos compteurs. On montre la ligne, sans
       écart, pour qu'on sache que la facture existe et qu'il manque des relevés. */
    const fiable = couv >= total/2;
    out.push({f, facture:f.volume, mesure:ramene, mesureBrute:mesure,
              couv, total, approx, fiable, ecart: fiable ? f.volume - ramene : null});
  }
  return out;
}

function blocSuivi(fl){
  if(!FLUIDES[fl].suivi) return '';
  const lignes = suiviFactures(fl), dec = FLUIDES[fl].dec;
  let html = `<div class="block">
    <div class="bhead"><div class="badge">${ico('courbe',26)}</div><div>
      <h2>${t('suiviTitre')}</h2><p>${t('suiviS')}</p></div></div>`;
  if(!lignes.length) return html + `<p class="vide">${t('suiviVide')}</p></div>`;

  const sures = lignes.filter(l=> l.fiable);         // seules elles entrent au total
  const tf = sures.reduce((s,l)=>s+l.facture,0);
  const tm = sures.reduce((s,l)=>s+l.mesure,0);
  const te = tf - tm;
  const pct = tm > 0 ? te/tm*100 : 0;
  const partielle = lignes.some(l=> l.approx || l.couv < l.total - 0.5);

  html += `<div class="scroll"><table>
    <thead><tr><th>${t('facture')}</th><th>${t('periode')}</th>
      <th>${t('kwhFacture')}</th><th>${t('kwhMesure')}</th>
      <th>${t('ecart')}</th><th>${t('couverture')}</th></tr></thead>
    <tbody>${lignes.map(l=>`<tr>
      <td>${esc(l.f.libelle)}</td>
      <td class="num">${dateFr(l.f.debut)} → ${dateFr(l.f.fin)}</td>
      <td class="num">${qte(l.facture, fl, dec)}</td>
      <td class="num">${l.approx ? '≈ ' : ''}${qte(l.mesure, fl, dec)}</td>
      ${l.ecart == null
        ? `<td class="num" style="color:var(--ink-3)">—</td>`
        : `<td class="num" style="color:${Math.abs(l.ecart) < l.mesure*0.02 ? 'var(--ink-3)'
            : (l.ecart > 0 ? 'var(--c3)' : 'var(--c1)')}">${signe(l.ecart, fl)}<br>
        <span style="color:var(--ink-3);font-size:12px">${
          l.mesure > 0 ? nf(l.ecart/l.mesure*100,1) + ' %' : '—'}</span></td>`}
      <td class="num">${l.couv >= l.total - 0.5 ? l.total + " " + t("jours")
        : `<span style="color:var(--warn)">${t('suiviPartiel',{n:l.couv, d:l.total})}</span>`}</td>
    </tr>`).join('')}
      <tr class="tot"><td>${t('total')}</td><td></td>
        <td class="num">${qte(tf, fl, dec)}</td><td class="num">${qte(tm, fl, dec)}</td>
        <td class="num">${signe(te, fl)}</td><td class="num"></td></tr>
    </tbody></table></div>`;

  const cle = Math.abs(pct) < 2 ? 'suiviNeutre' : (te > 0 ? 'suiviPositif' : 'suiviNegatif');
  html += `<p class="englobe">${t(cle,{x:qte(Math.abs(te), fl, dec), p:nf(Math.abs(pct),1)})}</p>`;
  if(partielle) html += `<p class="englobe">${t('suiviProrata')}</p>`;
  return html + `</div>`;
}
